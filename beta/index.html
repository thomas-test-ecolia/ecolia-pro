<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Académie — Espace élève</title>
<meta name="description" content="Académie — Lance et développe ton business de nettoyage auto">
<meta name="theme-color" content="#0071E3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Académie">
<meta name="mobile-web-app-capable" content="yes">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0071E3;--blue-light:#EDF4FE;--blue-mid:#B9DBFF;--blue-dark:#0062C4;
  --green-light:#E9F7EE;--green-dark:#12643A;--green-mid:#1D8A4E;
  --amber-light:#FFF4E5;--amber-dark:#8A4B00;
  --red-light:#FFEFEF;--red-dark:#9B0010;--red-mid:#D70015;
  --gray-bg:#F5F5F7;--gray-border:rgba(0,0,0,0.06);--gray-border-mid:rgba(0,0,0,0.12);
  --text-primary:#1D1D1F;--text-secondary:#6E6E73;--text-tertiary:#A1A1A6;
  --bg-primary:#ffffff;--bg-secondary:#F5F5F7;--bg-tertiary:#EBEBED;
  --radius-md:10px;--radius-lg:16px;--radius-xl:22px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.03);
  --shadow-md:0 2px 8px rgba(0,0,0,.04),0 10px 28px rgba(0,0,0,.05);
  --shadow-lg:0 16px 56px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
  --ease:cubic-bezier(.4,0,.2,1);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,sans-serif;
}
body{font-family:var(--font);background:var(--gray-bg);min-height:100vh;color:var(--text-primary);font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-0.011em}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
::selection{background:rgba(0,113,227,.16)}
input,select,textarea,button{font-family:var(--font);letter-spacing:inherit}

/* ── LOGIN ── */
.login-page{min-height:100vh;display:flex;background:var(--bg-primary)}
.login-left{flex:1;background:linear-gradient(160deg,#1D1D1F 0%,#12233A 55%,#0A2E52 100%);display:flex;flex-direction:column;justify-content:center;padding:4rem 3.5rem;min-height:100vh;position:relative;overflow:hidden}
.login-left::after{content:'';position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(0,113,227,.28),transparent 68%);top:-140px;right:-160px;pointer-events:none}
.login-left-logo{display:flex;align-items:center;gap:14px;margin-bottom:3.5rem;position:relative}
.login-left-icon{width:48px;height:48px;background:rgba(255,255,255,.12);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.16);border-radius:14px;display:flex;align-items:center;justify-content:center}
.login-left-name{font-size:21px;font-weight:600;color:#fff;letter-spacing:-.02em}
.login-left-sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:2px}
.login-left-title{font-size:40px;font-weight:600;color:#fff;line-height:1.08;letter-spacing:-.03em;margin-bottom:1.25rem;max-width:400px;position:relative}
.login-left-desc{font-size:15px;color:rgba(255,255,255,.62);line-height:1.65;max-width:380px;margin-bottom:2.75rem;position:relative}
.login-features{display:flex;flex-direction:column;gap:14px;position:relative}
.login-feat{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.86);font-size:13.5px}
.login-feat-icon{width:26px;height:26px;background:rgba(255,255,255,.1);border:.5px solid rgba(255,255,255,.14);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.login-right{width:500px;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--bg-primary)}
.login-box{width:100%;max-width:370px}
.login-tabs{display:flex;gap:4px;margin-bottom:2.25rem;background:var(--bg-secondary);padding:3px;border-radius:11px}
.login-tab{flex:1;padding:8px;text-align:center;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--text-secondary);border-radius:8px;transition:all .22s var(--ease)}
.login-tab.active{color:var(--text-primary);background:var(--bg-primary);box-shadow:var(--shadow-sm)}
.login-section-title{font-size:26px;font-weight:600;letter-spacing:-.025em;margin-bottom:6px}
.login-section-sub{font-size:14px;color:var(--text-secondary);margin-bottom:1.75rem;line-height:1.5}
.login-field{margin-bottom:14px}
.login-field label{font-size:12px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:6px;text-transform:none;letter-spacing:-.005em}
.login-field input{width:100%;padding:12px 14px;font-size:14px;border:.5px solid var(--gray-border-mid);border-radius:11px;background:var(--bg-primary);color:var(--text-primary);outline:none;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.login-field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.1)}
.login-field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login-btn{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:500;cursor:pointer;margin-top:1rem;transition:background .18s var(--ease),transform .12s var(--ease)}
.login-btn:hover{background:var(--blue-dark)}
.login-btn:active{transform:scale(.985)}
.login-btn:disabled{opacity:.45;cursor:not-allowed}
.login-error{background:var(--red-light);color:var(--red-dark);font-size:13px;padding:11px 14px;border-radius:11px;margin-top:14px;display:none}
.login-error.show{display:block}
.login-success{background:var(--green-light);color:var(--green-dark);font-size:13px;padding:11px 14px;border-radius:11px;margin-top:14px;display:none}
.login-success.show{display:block}
.login-hint{font-size:12px;color:var(--text-tertiary);text-align:center;margin-top:1.25rem;line-height:1.6}
.pw-strength{height:3px;border-radius:2px;margin-top:7px;background:var(--bg-tertiary);overflow:hidden}
.pw-strength-bar{height:100%;border-radius:2px;transition:width .35s var(--ease),background .35s var(--ease)}

/* ── LOADING ── */
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:var(--gray-bg)}
.spinner{width:30px;height:30px;border:2.5px solid rgba(0,0,0,.07);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── APP ── */
.app-layout{display:flex;min-height:100vh}
.sidebar{width:236px;background:rgba(255,255,255,.72);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-right:.5px solid var(--gray-border);display:flex;flex-direction:column;min-height:100vh;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100}
.logo{padding:1.5rem 1.25rem 1.25rem}
.logo-icon{width:38px;height:38px;background:linear-gradient(150deg,#0071E3,#0A5BB8);border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,113,227,.24)}
.logo-name{font-size:16px;font-weight:600;letter-spacing:-.02em}
.logo-sub{font-size:12px;color:var(--text-secondary);margin-top:2px}
.logo-user{font-size:12px;color:var(--blue);font-weight:500;margin-top:4px}
.nav-section{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-tertiary);padding:1.25rem 1.25rem .4rem;font-weight:500}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 12px;margin:1px 10px;border-radius:9px;font-size:13.5px;cursor:pointer;color:var(--text-secondary);transition:background .16s var(--ease),color .16s var(--ease);user-select:none}
.nav-item:hover{background:rgba(0,0,0,.04);color:var(--text-primary)}
.nav-item.active{color:var(--blue);background:var(--blue-light);font-weight:500}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.65}
.nav-item.active .nav-icon{opacity:1}
.nav-badge{margin-left:auto;background:rgba(0,0,0,.06);color:var(--text-secondary);font-size:11px;padding:1px 7px;border-radius:9px;font-weight:500;font-variant-numeric:tabular-nums}
.nav-item.active .nav-badge{background:var(--blue);color:#fff}
.nav-badge.green{background:var(--green-light);color:var(--green-mid)}
.sidebar-footer{margin-top:auto;padding:1rem 1.25rem 1.25rem;border-top:.5px solid var(--gray-border)}
.logout-btn{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-secondary);cursor:pointer;padding:7px 0;transition:color .16s var(--ease)}
.logout-btn:hover{color:var(--red-mid)}
.main{margin-left:236px;flex:1;padding:2rem 2.25rem;min-height:100vh;animation:fadeUp .32s var(--ease)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem}
.page-title{font-size:28px;font-weight:600;letter-spacing:-.028em}
.btn-group{display:flex;gap:8px}
.btn{padding:8px 16px;font-size:13.5px;border-radius:9px;cursor:pointer;font-weight:500;border:.5px solid var(--gray-border-mid);background:var(--bg-primary);color:var(--text-primary);transition:background .16s var(--ease),transform .12s var(--ease),box-shadow .16s var(--ease);box-shadow:var(--shadow-sm)}
.btn:hover{background:var(--bg-secondary)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);color:#fff;border-color:transparent;box-shadow:0 1px 3px rgba(0,113,227,.28)}
.btn.primary:hover{background:var(--blue-dark)}
.btn.sm{padding:5px 11px;font-size:12px}
.stats-grid{display:grid;gap:14px;margin-bottom:1.5rem}
.cols4{grid-template-columns:repeat(4,1fr)}
.cols3{grid-template-columns:repeat(3,1fr)}
.cols2{grid-template-columns:repeat(2,1fr)}
.stat-card{background:var(--bg-primary);border:.5px solid var(--gray-border);border-radius:var(--radius-lg);padding:1.25rem 1.35rem;box-shadow:var(--shadow-sm);transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-label{font-size:12.5px;color:var(--text-secondary);margin-bottom:8px}
.stat-value{font-size:30px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat-sub{font-size:12px;color:var(--green-mid);margin-top:7px;font-weight:500}
.stat-sub.red{color:var(--red-mid)}
.card{background:var(--bg-primary);border:.5px solid var(--gray-border);border-radius:var(--radius-lg);margin-bottom:1.25rem;overflow:hidden;box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.35rem;border-bottom:.5px solid var(--gray-border)}
.card-title{font-size:15px;font-weight:600;letter-spacing:-.015em}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:1.25rem}
.tbl-wrap{overflow-x:auto;width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:11px 16px;text-align:left;font-size:12px;font-weight:500;color:var(--text-secondary);border-bottom:.5px solid var(--gray-border);background:transparent;white-space:nowrap;letter-spacing:-.005em}
tbody td{padding:13px 16px;border-bottom:.5px solid var(--gray-border);color:var(--text-primary);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .14s var(--ease)}
tbody tr:hover td{background:rgba(0,0,0,.022)}
.td-right{text-align:right}
.td-num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:500;letter-spacing:-.005em}
.pill-blue{background:var(--blue-light);color:var(--blue)}
.pill-green{background:var(--green-light);color:var(--green-dark)}
.pill-amber{background:var(--amber-light);color:var(--amber-dark)}
.pill-red{background:var(--red-light);color:var(--red-dark)}
.progress-row{display:flex;align-items:center;gap:14px;padding:11px 1.35rem;border-bottom:.5px solid var(--gray-border);font-size:13px}
.progress-row:last-child{border-bottom:none}
.prog-label{flex:1}
.prog-bar-wrap{width:100px;height:6px;background:var(--bg-tertiary);border-radius:100px;overflow:hidden}
.prog-bar{height:100%;border-radius:100px;background:var(--blue);transition:width .5s var(--ease)}
.prog-pct{width:34px;text-align:right;font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.cal-layout{display:grid;grid-template-columns:1fr 300px;gap:14px}
.week-head-row{display:flex;border-bottom:.5px solid var(--gray-border)}
.week-head-hourgutter{width:44px;flex-shrink:0;box-sizing:border-box;border-right:.5px solid var(--gray-border)}
.week-clip{flex:1;overflow:hidden;min-width:0}
.week-track{display:flex;width:300%;transform:translateX(-33.3333%);will-change:transform}
.week-panel{flex:0 0 33.3333%;min-width:0}
.week-panel.head{display:grid;grid-template-columns:repeat(7,1fr)}
.week-panel.body{display:flex}
.week-head-cell{text-align:center;padding:8px 0;cursor:pointer;border-right:.5px solid var(--gray-border)}
.week-head-cell:last-child{border-right:none}
.week-head-cell.today .week-daynum{background:var(--blue);color:#fff}
.week-head-cell.selected{background:var(--blue-light)}
.week-daynum{font-size:15px;font-weight:600;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:2px auto 0;font-variant-numeric:tabular-nums}
.week-body-scroll{max-height:600px;overflow-y:auto;overscroll-behavior-x:contain}
.week-body-row{display:flex}
.week-hour-col{width:44px;flex-shrink:0}
.week-hour-label{font-size:11px;font-weight:600;color:var(--text-secondary);text-align:right;padding-right:6px;box-sizing:border-box;position:relative;border-top:1px solid rgba(0,0,0,.22)}
.week-hour-label .half{position:absolute;right:6px;font-size:9px;font-weight:400;color:var(--text-tertiary)}
.week-day-col{flex:1;border-left:.5px solid var(--gray-border);min-width:0}
.slot-dragging .agenda-ev{pointer-events:none;opacity:.35}
.slot-dragging{user-select:none;-webkit-user-select:none}
.smx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:1.25rem}
.smx-card{background:var(--bg-primary);border:.5px solid var(--gray-border);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow-sm);position:relative}
.smx-locked{opacity:.55;filter:grayscale(.55)}
.smx-lockbadge{position:absolute;top:12px;right:14px;font-size:17px}
.smx-chip{display:inline-block;padding:3px 10px;margin:0 6px 6px 0;border-radius:100px;background:var(--blue-light);color:var(--blue);font-size:11.5px;font-weight:600;cursor:pointer;border:none;font-family:inherit}
.smx-bar{height:10px;border-radius:100px;background:var(--bg-tertiary);overflow:hidden}
.smx-bar>div{height:100%;border-radius:100px;transition:width .4s}
.smx-ta{width:100%;min-height:78px;padding:10px 13px;font-size:13.5px;line-height:1.45;border:.5px solid var(--gray-border-mid);border-radius:10px;font-family:inherit;resize:vertical;background:var(--bg-primary);color:var(--text-primary)}
.smx-pv{background:var(--bg-secondary);border-radius:12px;padding:10px 13px;font-size:12.5px;color:var(--text-secondary);margin-top:8px}
.smx-grp{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin:1.4rem 0 .7rem}
.day-names-row{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:.5px solid var(--gray-border)}
.day-name-cell{padding:9px 0;text-align:center;font-size:11.5px;color:var(--text-tertiary);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.day-cell{min-height:78px;border-right:.5px solid var(--gray-border);border-bottom:.5px solid var(--gray-border);padding:6px;cursor:pointer;transition:background .14s var(--ease)}
.day-cell:hover{background:rgba(0,0,0,.025)}
.day-cell:nth-child(7n){border-right:none}
.day-cell.selected{background:var(--blue-light)}
.day-num{font-size:12px;color:var(--text-secondary);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:3px;font-variant-numeric:tabular-nums}
.day-num.today{background:var(--blue);color:#fff;font-weight:600}
.day-num.other-month{color:var(--text-tertiary);opacity:.5}
.ev-chip{font-size:10px;padding:2px 6px;border-radius:5px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ev-chip.nettoyage{background:var(--blue-light);color:var(--blue)}
.ev-chip.visite{background:var(--green-light);color:var(--green-dark)}
.ev-chip.coaching{background:var(--amber-light);color:var(--amber-dark)}
.cal-legend{display:flex;gap:14px;padding:.8rem 1.35rem;border-top:.5px solid var(--gray-border)}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)}
.leg-dot{width:8px;height:8px;border-radius:3px}
.side-panel{background:var(--bg-primary);border:.5px solid var(--gray-border);border-radius:var(--radius-lg);display:flex;flex-direction:column;overflow:hidden;max-height:620px;box-shadow:var(--shadow-sm)}
.side-panel-head{padding:1.1rem 1.35rem;border-bottom:.5px solid var(--gray-border)}
.side-panel-title{font-size:15px;font-weight:600;letter-spacing:-.015em}
.side-panel-sub{font-size:12px;color:var(--text-secondary);margin-top:3px}
.side-panel-body{flex:1;overflow-y:auto;padding:.7rem}
.rdv-item{border:.5px solid var(--gray-border);border-radius:11px;padding:11px 13px;margin-bottom:7px;transition:background .14s var(--ease)}
.rdv-item:hover{background:var(--bg-secondary)}
.rdv-time{font-size:11px;color:var(--text-tertiary);margin-bottom:3px;font-variant-numeric:tabular-nums}
.rdv-name{font-size:13px;font-weight:500}
.rdv-del{float:right;font-size:14px;color:var(--text-tertiary);cursor:pointer;margin-top:-18px}
.rdv-del:hover{color:var(--red-mid)}
.add-rdv-btn{margin:.7rem;padding:10px;border:.5px dashed var(--gray-border-mid);border-radius:11px;background:none;cursor:pointer;font-size:13px;color:var(--text-secondary);text-align:center;width:calc(100% - 1.4rem);transition:all .16s var(--ease)}
.add-rdv-btn:hover{background:var(--bg-secondary);color:var(--text-primary)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex;animation:fadeUp .2s var(--ease)}
.modal{background:var(--bg-primary);border-radius:var(--radius-xl);border:.5px solid var(--gray-border);padding:1.85rem;width:500px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-title{font-size:20px;font-weight:600;letter-spacing:-.022em;margin-bottom:1.35rem}
.field{margin-bottom:14px}
.field label{font-size:12.5px;color:var(--text-secondary);display:block;margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;font-size:14px;border:.5px solid var(--gray-border-mid);border-radius:10px;background:var(--bg-primary);color:var(--text-primary);outline:none;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.1)}
.field textarea{resize:vertical;min-height:78px;line-height:1.5}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:10px;margin-top:1.6rem}
.btn-cancel{flex:1;padding:11px;border:.5px solid var(--gray-border-mid);border-radius:10px;background:none;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-secondary);transition:background .16s var(--ease)}
.btn-cancel:hover{background:var(--bg-secondary)}
.btn-save{flex:2;padding:11px;border:none;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer;font-size:14px;font-weight:500;transition:background .16s var(--ease),transform .12s var(--ease)}
.btn-save:hover{background:var(--blue-dark)}
.btn-save:active{transform:scale(.985)}
.crm-bar{display:flex;gap:10px;padding:1rem 1.35rem;border-bottom:.5px solid var(--gray-border);align-items:center}
.crm-search{flex:1;padding:9px 13px;font-size:14px;border:.5px solid var(--gray-border-mid);border-radius:10px;background:var(--bg-primary);color:var(--text-primary);outline:none;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.crm-search:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.1)}
.evo-up{color:var(--green-mid);font-weight:500}
.evo-down{color:var(--red-mid);font-weight:500}

.del-btn{cursor:pointer;color:var(--text-tertiary);font-size:15px;transition:color .14s var(--ease)}

.empty{padding:3rem 2rem;text-align:center;font-size:14px;color:var(--text-tertiary)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.35rem;border-bottom:.5px solid var(--gray-border)}
.cal-nav-title{font-size:16px;font-weight:600;letter-spacing:-.018em}
.cal-nav-btn{background:var(--bg-primary);border:.5px solid var(--gray-border-mid);border-radius:9px;padding:5px 12px;cursor:pointer;font-size:14px;color:var(--text-primary);transition:background .16s var(--ease)}
.cal-nav-btn:hover{background:var(--bg-secondary)}
.modules-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.module-card{background:var(--bg-primary);border:.5px solid var(--gray-border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.module-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.module-card-head{padding:1.35rem;border-bottom:.5px solid var(--gray-border)}
.module-num{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--blue);margin-bottom:6px}
.module-title{font-size:16px;font-weight:600;margin-bottom:6px;letter-spacing:-.018em}
.module-desc-short{font-size:13px;color:var(--text-secondary);line-height:1.55}
.module-card-foot{display:flex;align-items:center;padding:.9rem 1.35rem;gap:12px}
.module-prog-wrap{flex:1;height:5px;background:var(--bg-tertiary);border-radius:100px}
.module-prog-bar{height:100%;border-radius:100px;background:var(--blue);transition:width .5s var(--ease)}
.module-prog-pct{font-size:12px;color:var(--text-secondary);min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
.mod-back{display:flex;align-items:center;gap:8px;margin-bottom:1.5rem;cursor:pointer;color:var(--text-secondary);font-size:13.5px;width:fit-content;transition:color .16s var(--ease)}
.mod-back:hover{color:var(--blue)}
.mod-header{margin-bottom:1.5rem}
.mod-header-title{font-size:28px;font-weight:600;margin-bottom:6px;letter-spacing:-.028em}
.mod-header-sub{font-size:14px;color:var(--text-secondary);line-height:1.55}
.mod-tabs{display:flex;gap:4px;margin-bottom:1.5rem;background:var(--bg-secondary);padding:3px;border-radius:11px;overflow-x:auto;width:fit-content;max-width:100%}
.mod-tab{padding:7px 16px;font-size:13.5px;cursor:pointer;color:var(--text-secondary);border-radius:8px;font-weight:500;white-space:nowrap;transition:all .2s var(--ease)}
.mod-tab:hover{color:var(--text-primary)}
.mod-tab.active{color:var(--text-primary);background:var(--bg-primary);box-shadow:var(--shadow-sm)}
.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:1.25rem}
.video-card{background:var(--bg-primary);border:.5px solid var(--gray-border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
.video-thumb{background:#000;aspect-ratio:16/9}
.video-thumb iframe{width:100%;height:100%;border:none;display:block}
.video-info{padding:.9rem 1.05rem}
.video-title{font-size:14px;font-weight:500;margin-bottom:4px}
.video-dur{font-size:12px;color:var(--text-secondary)}
.keypoints{padding:.35rem 0}
.keypoint{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:.5px solid var(--gray-border)}
.keypoint:last-child{border-bottom:none}
.kp-dot{width:22px;height:22px;background:var(--blue-light);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.kp-text{font-size:14px;line-height:1.6}
.pdf-list{padding:.5rem 0}
.pdf-item{display:flex;align-items:center;gap:13px;padding:12px 14px;border:.5px solid var(--gray-border);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:background .16s var(--ease)}
.pdf-item:hover{background:var(--bg-secondary)}
.pdf-icon{width:38px;height:38px;background:var(--red-light);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pdf-name{flex:1;font-size:14px;font-weight:500}
.pdf-size{font-size:12px;color:var(--text-secondary)}
.quiz-question{margin-bottom:1.75rem}
.quiz-q-text{font-size:15px;font-weight:500;margin-bottom:12px;line-height:1.5}
.quiz-options{display:flex;flex-direction:column;gap:9px}
.quiz-option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:.5px solid var(--gray-border-mid);border-radius:11px;cursor:pointer;font-size:14px;transition:all .18s var(--ease)}
.quiz-option:hover{background:var(--bg-secondary)}
.quiz-option.selected{border-color:var(--blue);background:var(--blue-light);color:var(--blue-dark)}
.quiz-option.correct{border-color:var(--green-mid);background:var(--green-light);color:var(--green-dark)}
.quiz-option.wrong{border-color:var(--red-mid);background:var(--red-light);color:var(--red-dark)}
.quiz-radio{width:18px;height:18px;border:1.5px solid var(--gray-border-mid);border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .18s var(--ease)}
.quiz-radio.on{border-color:var(--blue);background:var(--blue)}
.quiz-radio.on::after{content:'';width:6px;height:6px;background:#fff;border-radius:50%}
.quiz-result{padding:1.25rem;border-radius:var(--radius-md);margin-top:1.25rem;font-size:16px;font-weight:600;text-align:center}
.quiz-result.good{background:var(--green-light);color:var(--green-dark)}
.quiz-result.bad{background:var(--red-light);color:var(--red-dark)}

/* MOBILE */
.mobile-nav{display:none}

  .stats-grid.cols4,.metrics.cols4{grid-template-columns:repeat(2,1fr)}

/* ═══ COMPOSANTS REDESSINÉS ═══ */

/* — Cartes métriques — */
.metrics{display:grid;gap:14px;margin-bottom:1.5rem}
.metric{position:relative;background:var(--bg-primary);border:.5px solid var(--gray-border);border-radius:var(--radius-lg);padding:1.15rem 1.25rem 1.2rem;box-shadow:var(--shadow-sm);overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.metric::before{content:'';position:absolute;inset:0 0 auto 0;height:2.5px;background:var(--accent,var(--blue));opacity:.9}
.metric:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.metric-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.metric-label{font-size:11.5px;font-weight:500;color:var(--text-secondary);letter-spacing:-.005em}
.metric-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft,var(--blue-light));color:var(--accent,var(--blue));flex-shrink:0}
.metric-val{font-size:32px;font-weight:600;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent-text,var(--text-primary))}
.metric-foot{margin-top:9px;font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;font-size:11.5px;font-weight:500;background:var(--bg-secondary);color:var(--text-secondary)}
.chip.pos{background:var(--green-light);color:var(--green-mid)}
.chip.neg{background:var(--red-light);color:var(--red-mid)}
.chip.warn{background:var(--amber-light);color:var(--amber-dark)}

/* — Liste des prospects — */
.lead-tbl{width:100%;border-collapse:separate;border-spacing:0}
.lead-tbl thead th{padding:10px 16px;font-size:11.5px;font-weight:500;color:var(--text-tertiary);text-align:left;border-bottom:.5px solid var(--gray-border);white-space:nowrap;text-transform:uppercase;letter-spacing:.045em}
.lead-row{transition:background .16s var(--ease)}
.lead-row>td{padding:11px 16px;border-bottom:.5px solid var(--gray-border);vertical-align:middle;background:transparent}
.lead-row:last-child>td{border-bottom:none}
.lead-row:hover>td{background:rgba(0,0,0,.022)}
.lead-row>td:first-child{position:relative;padding-left:20px}
.lead-row>td:first-child::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent,transparent);opacity:.85}
.avatar{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:12.5px;font-weight:600;color:#fff;flex-shrink:0;letter-spacing:-.02em;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.lead-id{display:flex;align-items:center;gap:11px;cursor:pointer}
.lead-name{font-size:14px;font-weight:500;letter-spacing:-.012em;line-height:1.25}
.lead-mail{font-size:11.5px;color:var(--text-tertiary);margin-top:1px}
.lead-tel{font-size:13.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.lead-meta{font-size:12.5px;color:var(--text-secondary)}
.lead-ca{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.015em}

/* — Sélecteur de statut — */
.st-sel{appearance:none;-webkit-appearance:none;padding:5px 26px 5px 11px;border-radius:100px;font-size:11.5px;font-weight:600;border:none;cursor:pointer;font-family:var(--font);letter-spacing:-.005em;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'%3E%3Cpath d='M2.5 4l2.5 2.5L7.5 4' stroke='currentColor' stroke-width='1.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;transition:filter .16s var(--ease)}
.st-sel:hover{filter:brightness(.96)}

/* — Actions au survol — */
.row-act{display:flex;gap:2px;align-items:center;opacity:0;transition:opacity .18s var(--ease)}
.lead-row:hover .row-act,.lead-row:focus-within .row-act{opacity:1}
.ico-btn{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;cursor:pointer;text-decoration:none;font-size:13px;color:var(--text-secondary);transition:background .14s var(--ease),color .14s var(--ease)}
.ico-btn:hover{background:var(--bg-secondary);color:var(--text-primary)}
.ico-btn.danger:hover{background:var(--red-light);color:var(--red-mid)}

/* — Filtres segmentés — */
.seg-wrap{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:1.25rem}
.seg{padding:6px 13px;border-radius:100px;font-size:12.5px;font-weight:500;cursor:pointer;border:.5px solid var(--gray-border-mid);background:var(--bg-primary);color:var(--text-secondary);transition:all .18s var(--ease);user-select:none;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow-sm)}
.seg:hover{background:var(--bg-secondary)}
.seg .n{font-variant-numeric:tabular-nums;opacity:.6;font-size:11.5px}
.seg.on{background:var(--text-primary);color:#fff;border-color:transparent}
.seg.on .n{opacity:.65}
.seg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* — Barre de recherche — */
.srch{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:.5px solid var(--gray-border)}
.srch input{border:none;outline:none;font-size:14px;flex:1;background:transparent;color:var(--text-primary);letter-spacing:-.011em}
.srch input::placeholder{color:var(--text-tertiary)}

/* — Graphique — */
.bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:6px}
.bar-stack{width:100%;max-width:46px;display:flex;flex-direction:column;justify-content:flex-end;height:104px;gap:2px;margin:0 auto}
.bar-seg{width:100%;border-radius:6px;transition:height .5s var(--ease)}
.bar-lbl{font-size:11.5px;color:var(--text-tertiary);font-weight:500}
.bar-val{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

@media(max-width:768px){
  .metric-val{font-size:26px}
  .lead-row>td{padding:10px 12px}
  .row-act{opacity:1}
}

/* ═══════════════════════════════════════════
   PARTI PRIS « COCKPIT »
   Châssis graphite + reflet de carrosserie
   ═══════════════════════════════════════════ */

/* — Reflet spéculaire : la signature — */
.gloss{position:relative;overflow:hidden}
.gloss::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(112deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.03) 24%,transparent 40%,transparent 70%,rgba(255,255,255,.06) 100%)}

/* — Barre latérale graphite — */
.sidebar{background:linear-gradient(180deg,#1C1C1F 0%,#141417 100%);backdrop-filter:none;-webkit-backdrop-filter:none;border-right:.5px solid rgba(255,255,255,.07)}
.logo{border-bottom:.5px solid rgba(255,255,255,.07)}
.logo-name{color:#F5F5F7}
.logo-sub{color:rgba(255,255,255,.42)}
.logo-user{color:#5AA9FF}
.nav-section{color:rgba(255,255,255,.32)}
.nav-item{color:rgba(255,255,255,.6);position:relative}
.nav-item:hover{background:rgba(255,255,255,.06);color:#F5F5F7}
.nav-item.active{background:rgba(255,255,255,.1);color:#fff;font-weight:500}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:17px;border-radius:0 3px 3px 0;background:#0A84FF;box-shadow:0 0 10px rgba(10,132,255,.7)}
.nav-badge{background:rgba(255,255,255,.11);color:rgba(255,255,255,.72)}
.nav-item.active .nav-badge{background:#0A84FF;color:#fff}
.nav-badge.green{background:rgba(48,209,88,.18);color:#4ADE80}
.sidebar-footer{border-top:.5px solid rgba(255,255,255,.07)}
.logout-btn{color:rgba(255,255,255,.5)}
.logout-btn:hover{color:#FF6B6B}
.sidebar::-webkit-scrollbar{width:0}

/* — Bandeau d'accueil — */
.hero{position:relative;overflow:hidden;border-radius:var(--radius-xl);padding:1.8rem 2rem 1.6rem;margin-bottom:1.5rem;
  background:linear-gradient(145deg,#212125 0%,#151519 52%,#0D1B2E 100%);
  box-shadow:0 20px 50px -22px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.2)}
.hero::before{content:'';position:absolute;width:460px;height:460px;border-radius:50%;top:-230px;right:-100px;z-index:1;
  background:radial-gradient(circle,rgba(10,132,255,.38),transparent 66%);pointer-events:none}
.hero>*{position:relative;z-index:3}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:1.5rem}
.hero-date{font-size:12px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.09em;font-weight:500;margin-bottom:7px}
.hero-hi{font-size:32px;font-weight:600;color:#fff;letter-spacing:-.032em;line-height:1.05}
.hero-acts{display:flex;gap:8px;flex-shrink:0}
.hero-btn{padding:8px 16px;border-radius:100px;font-size:13px;font-weight:500;cursor:pointer;border:.5px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.08);color:#fff;backdrop-filter:blur(10px);transition:background .18s var(--ease),transform .12s var(--ease)}
.hero-btn:hover{background:rgba(255,255,255,.15)}
.hero-btn:active{transform:scale(.97)}
.hero-btn.solid{background:#0A84FF;border-color:transparent;box-shadow:0 3px 14px rgba(10,132,255,.42)}
.hero-btn.solid:hover{background:#3D9BFF}
.hero-stats{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.hero-stat{padding-right:2.4rem;margin-right:2.4rem;border-right:.5px solid rgba(255,255,255,.13)}
.hero-stat:last-child{border-right:none;padding-right:0;margin-right:0}
.hero-k{font-size:11.5px;color:rgba(255,255,255,.45);letter-spacing:.03em;margin-bottom:6px;font-weight:500}
.hero-v{font-size:29px;font-weight:600;color:#fff;letter-spacing:-.032em;line-height:1;font-variant-numeric:tabular-nums}
.hero-v.dim{color:rgba(255,255,255,.55);font-size:23px}
.hero-v .u{font-size:17px;opacity:.55;margin-left:1px}

/* — Halo coloré en tête des cartes métriques — */
.metric>*{position:relative;z-index:1}
.metric::after{content:'';position:absolute;top:0;left:0;right:0;height:74px;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,var(--accent-soft,transparent),transparent);opacity:.6}
.metric::before{background:linear-gradient(90deg,var(--accent,var(--blue)),color-mix(in srgb,var(--accent,#0071E3) 45%,#fff))}

/* — Arrivée en cascade des lignes — */
@keyframes rowIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.lead-row{animation:rowIn .4s var(--ease) backwards;animation-delay:calc(min(var(--i,0),14)*24ms)}

/* — Avatars : léger relief — */
.avatar{position:relative;overflow:hidden}
.avatar::after{content:'';position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.28),transparent 52%)}

@media(max-width:768px){
  .hero{padding:1.4rem 1.25rem 1.3rem;border-radius:var(--radius-lg)}
  .hero-hi{font-size:25px}
  .hero-top{flex-direction:column;gap:14px}
  .hero-acts{width:100%}
  .hero-btn{flex:1;text-align:center}
  .hero-stat{padding-right:1.4rem;margin-right:1.4rem}
  .hero-v{font-size:22px}
  .hero-v.dim{font-size:18px}
}
@media(prefers-reduced-motion:reduce){.lead-row{animation:none}}

/* ═══════════════════════════════════════════
   MOBILE : rien ne doit dépasser de l'écran, tout se touche du pouce
   ═══════════════════════════════════════════ */

<script>
// ═══════════════════════════════════
// GOOGLE CALENDAR CONFIG
// ═══════════════════════════════════
const GOOGLE_CLIENT_ID = '800330767356-ru52r1tmaickrdtnkftjjicheauou8og.apps.googleusercontent.com';
const GOOGLE_SCOPES = 'https://www.googleapis.com/auth/calendar.events';
let googleAccessToken = null, googleTokenAt = 0, googleLost = false;
let googleConnected = false;
let gapiReady = false;

function initGoogleAPI(){
  return new Promise((resolve) => {
    function tryInit(){
      if(typeof gapi === 'undefined'){ setTimeout(tryInit, 500); return; }
      gapi.load('client', async () => {
        try {
          await gapi.client.init({
            discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest']
          });
          gapiReady = true;
          resolve(true);
        } catch(e){ console.error('gapi init error:', e); resolve(false); }
      });
    }
    tryInit();
  });
}

// Appelle nos fonctions serveur Supabase (Edge Functions) qui gèrent l'échange/renouvellement des jetons Google
const GOOGLE_FUNCTION_SLUGS = {'google-oauth-exchange':'swift-handler','google-oauth-refresh':'bright-endpoint'};
async function callGoogleTokenFunction(name, body){
  const{data:{session}}=await sb.auth.getSession();
  if(!session) return {error:'Non connecté'};
  const resp = await fetch(`${SUPABASE_URL}/functions/v1/${GOOGLE_FUNCTION_SLUGS[name]||name}`, {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},
    body: JSON.stringify(body||{})
  });
  return resp.json();
}

function connectGoogleCalendar(){
  if(typeof google === 'undefined' || !google.accounts){
    alert('Chargement en cours, réessaie dans quelques secondes.');
    return;
  }
  const client = google.accounts.oauth2.initCodeClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GOOGLE_SCOPES,
    ux_mode: 'popup',
    access_type: 'offline',
    prompt: 'consent',
    callback: async (resp) => {
      if(resp.error){ console.error(resp); return; }
      const data = await callGoogleTokenFunction('google-oauth-exchange', {code:resp.code, redirect_uri:'postmessage'});
      if(data.error){ alert('Erreur de connexion Google : '+data.error); return; }
      googleAccessToken = data.access_token; googleTokenAt = Date.now(); googleLost = false;
      googleConnected = true;
      if(gapiReady) gapi.client.setToken({access_token: googleAccessToken});
      render();
      if(S.page==='agenda') syncFromGoogleCalendar();
      let seen=false; try{ seen=localStorage.getItem('ecolia_google_intro_'+currentUser.id)==='1'; localStorage.setItem('ecolia_google_intro_'+currentUser.id,'1'); }catch(e){}
      if(seen) alert('Google Agenda connecté définitivement ! Plus besoin de te reconnecter à chaque rechargement de page.'); else googleHelp();
    }
  });
  client.requestCode();
}

async function disconnectGoogleCalendar(){
  if(googleAccessToken) google.accounts.oauth2.revoke(googleAccessToken, ()=>{});
  googleAccessToken = null;
  googleConnected = false;
  render();
  await callGoogleTokenFunction('google-oauth-refresh', {disconnect:true});
}

// Reconnecte silencieusement Google Agenda au chargement, via notre fonction serveur (pas de popup, donc jamais bloqué par le navigateur)
async function tryReconnectGoogleCalendar(){
  try{
    const data = await callGoogleTokenFunction('google-oauth-refresh', {});
    if(data.error || !data.access_token) return; // pas encore connecté, ou jeton absent : rien à faire
    googleAccessToken = data.access_token; googleTokenAt = Date.now(); googleLost = false;
    googleConnected = true;
    if(gapiReady) gapi.client.setToken({access_token: googleAccessToken});
    render();
    if(S.page==='agenda') syncFromGoogleCalendar();
  }catch(e){ console.error('Reconnexion Google silencieuse : échec', e); }
}
// Le jeton Google ne dure qu'environ 1 h : on le renouvelle avant qu'il expire (ou tout de suite si Google l'a refusé).
// Si le renouvellement échoue, la connexion est vraiment perdue : on le dit à l'élève au lieu de rester silencieux.
async function ensureGoogleToken(force){
  if(!googleConnected) return false;
  if(!force && Date.now()-googleTokenAt < 40*60000) return true;
  try{
    const data = await callGoogleTokenFunction('google-oauth-refresh', {});
    if(data && data.access_token){
      googleAccessToken = data.access_token; googleTokenAt = Date.now(); googleLost = false;
      if(gapiReady) gapi.client.setToken({access_token: googleAccessToken});
      return true;
    }
    if(data && data.error){ googleConnected=false; googleLost=true; googleAccessToken=null; render(); return false; }
  }catch(e){ console.error('Renouvellement du jeton Google', e); }
  return false;
}

// Construit une description détaillée (téléphone client, adresse, électricité, options, notes...) pour l'événement Google Agenda
function buildGoogleDescription(interv){
  const c = D.clients.find(x=>x.id===interv.client_id||x.id==interv.client_id);
  const lines = [];
  if(interv.prestation) lines.push(`Prestation : ${interv.prestation}`);
  if(c?.phone) lines.push(`Téléphone : ${c.phone}`);
  if(c?.email) lines.push(`Email : ${c.email}`);
  if(interv.vehicle) lines.push(`Véhicule : ${interv.vehicle}`);
  lines.push(`Électricité sur place : ${interv.electricite==='non'?'Non':'Oui'}`);
  const optNames = (interv.options||[]).map(id=>D.options.find(o=>o.id===id||o.id==id)?.nom).filter(Boolean);
  if(optNames.length) lines.push(`Options : ${optNames.join(', ')}`);
  if(interv.montant) lines.push(`Montant : ${interv.montant}€`);
  if(interv.moyen_paiement) lines.push(`Paiement : ${interv.moyen_paiement}`);
  if(interv.infos_complementaires) lines.push(`Infos complémentaires : ${interv.infos_complementaires}`);
  return lines.join('\n');
}

// Export d'une intervention (RDV) vers Google Agenda — crée l'événement, ou le met à jour s'il existe déjà
let googleExportsInFlight = 0, googleLastExportAt = 0;
// Supprime l'événement Google lié à un RDV du CRM (si Google est connecté)
async function deleteGoogleEventFor(interv){
  if(!interv || !interv.google_event_id || !googleConnected || !gapiReady) return;
  googleExportsInFlight++;
  try {
    await gapi.client.calendar.events.delete({calendarId:'primary', eventId:interv.google_event_id});
  } catch(err){
    const code = err && (err.status || (err.result && err.result.error && err.result.error.code));
    if(code!==404 && code!==410) console.error('Suppression Google error:', err); // 404/410 = déjà supprimé côté Google
  } finally { googleExportsInFlight--; googleLastExportAt = Date.now(); }
}
async function autoExportToGoogle(interv, retried){
  if(!googleConnected || !gapiReady) return;
  await ensureGoogleToken(false);
  if(!googleConnected) return;
  googleExportsInFlight++;
  let retry=false;
  try {
    const pad = n => String(n).padStart(2,'0');
    const [h,m2] = (interv.heure||'09:00').split(':');
    const start = `${interv.date}T${pad(h)}:${pad(m2)}:00`;
    const finHeure = addMinutes(interv.heure||'09:00', interv.duree||60);
    const end = `${interv.date}T${finHeure}:00`;
    const resource = {
      summary: `${interv.client_name} — ${interv.prestation||'Prestation'}`,
      description: buildGoogleDescription(interv),
      location: interv.adresse||'',
      start: {dateTime: start, timeZone: 'Europe/Paris'},
      end: {dateTime: end, timeZone: 'Europe/Paris'}
    };
    const resp = interv.google_event_id
      ? await gapi.client.calendar.events.update({calendarId:'primary', eventId:interv.google_event_id, resource})
      : await gapi.client.calendar.events.insert({calendarId:'primary', resource});
    const eventId = resp.result?.id;
    if(eventId && eventId!==interv.google_event_id){
      await sb.from('interventions').update({google_event_id:eventId}).eq('id',interv.id);
      interv.google_event_id = eventId;
    }
  } catch(err){
    console.error('Export Google error:', err);
    const code = err && (err.status || (err.result && err.result.error && err.result.error.code));
    if(!retried && (code===401 || code===403) && await ensureGoogleToken(true)) retry=true;
  }
  finally { googleExportsInFlight--; googleLastExportAt = Date.now(); }
  if(retry) return autoExportToGoogle(interv, true);
}

// Récupère dans le CRM les événements créés/modifiés directement côté Google Agenda (sens Google → CRM)
let googleSyncInFlight = false;
let googleLastSyncAt = null;
let googleOtherEvents = []; // événements Google "personnels" (non liés à un RDV du CRM), affichés en gris dans l'agenda
function googleOnDay(y,m,d){
  const pad=n=>String(n).padStart(2,'0');
  const out=[];
  for(const ev of googleOtherEvents){
    if(!ev.start||!ev.start.dateTime) continue;
    const st=new Date(ev.start.dateTime);
    if(st.getFullYear()!==y||st.getMonth()!==m||st.getDate()!==d) continue;
    const en=(ev.end&&ev.end.dateTime)?new Date(ev.end.dateTime):new Date(st.getTime()+3600000);
    const startMin=st.getHours()*60+st.getMinutes();
    const duree=Math.max(15,Math.min(Math.round((en-st)/60000),1440-startMin));
    out.push({g:true,id:ev.id,heure:`${pad(st.getHours())}:${pad(st.getMinutes())}`,duree,title:(ev.summary||'(sans titre)')});
  }
  return out;
}
async function createRdvFromGoogleEvent(ev, parsed){
  const pad=n=>String(n).padStart(2,'0');
  const rawName = parsed.name;
  const startDt = ev.start.dateTime ? new Date(ev.start.dateTime) : new Date(ev.start.date+'T09:00:00');
  const endDt = (ev.end && ev.end.dateTime) ? new Date(ev.end.dateTime) : new Date(startDt.getTime()+60*60000);
  const date = `${startDt.getFullYear()}-${pad(startDt.getMonth()+1)}-${pad(startDt.getDate())}`;
  const heure = `${pad(startDt.getHours())}:${pad(startDt.getMinutes())}`;
  const duree = Math.max(15, Math.round((endDt-startDt)/60000));
  // même nom, ou à défaut même numéro de téléphone = même client
  let client = D.clients.find(c=>normTxt(c.name)===normTxt(rawName))
    || (parsed.phone ? D.clients.find(c=>c.phone && phoneKey(c.phone)===phoneKey(parsed.phone)) : null);
  const addrGoogle = (ev.location||parsed.adresse||'').trim();
  if(!client){
    const base = {user_id: currentUser.id, name: rawName, ca:0, status:'client', type_client:'particulier', source:'google_agenda', adresse_postale: addrGoogle||null};
    let res = await sb.from('clients').insert({...base, phone: parsed.phone||null}).select().single();
    if(res.error && parsed.phone) res = await sb.from('clients').insert({...base, phone:null}).select().single(); // téléphone refusé (déjà utilisé ?) : on crée sans
    if(res.error) return null;
    client = res.data; D.clients.push(client);
  } else {
    const patch = {};
    if(client.status!=='client') patch.status='client';
    if(parsed.phone && !client.phone) patch.phone=parsed.phone;
    if(addrGoogle && !(client.adresse_postale||'').trim()) patch.adresse_postale=addrGoogle;
    if(Object.keys(patch).length){
      const{error}=await sb.from('clients').update(patch).eq('id',client.id);
      if(!error) Object.assign(client, patch);
    }
  }
  const notes = [ev.description||'', ...(parsed.extra||[])].filter(Boolean).join('\n');
  const row = {
    user_id: currentUser.id, client_id: client.id, client_name: client.name,
    date, heure, duree, statut:'planifie', montant: parsed.montant||0,
    vehicle:'', adresse: ev.location||parsed.adresse||'', infos_complementaires: notes,
    prestation: parsed.prestation||'', electricite:'oui', options:[], google_event_id: ev.id
  };
  const{data,error}=await sb.from('interventions').insert(row).select().single();
  if(error) return null;
  D.interventions.push(data);
  return data;
}
// Explication de la synchronisation Google Agenda (affichée à la 1re connexion, et à la demande depuis l'agenda)
function googleHelp(){
  $('modal-content').innerHTML=`<div class="modal-title">📅 Comment fonctionne ton Google Agenda dans le CRM</div>
  <div style="font-size:13.5px;line-height:1.6;color:var(--text-primary)">
    <p style="margin:0 0 10px">Ton agenda Google est lu <strong>dans les deux sens</strong>. Le CRM affiche tes événements des <strong>7 derniers jours</strong> et des <strong>90 prochains jours</strong>.</p>
    <div style="background:var(--bg-tertiary);border-radius:10px;padding:11px 14px;margin-bottom:10px"><strong style="color:var(--blue)">🟦 Un événement dont le titre commence par « RDV »</strong> devient automatiquement un <strong>rendez-vous client</strong> : le client est créé, avec son téléphone, l'adresse, la prestation et le prix lus dans le titre.<br><span style="font-family:monospace;font-size:12.5px">RDV - Nom Prénom - 06 12 34 56 78 - 12 rue des Lilas - Nettoyage complet - 130</span></div>
    <div style="background:var(--bg-tertiary);border-radius:10px;padding:11px 14px;margin-bottom:10px"><strong>⬜ Tous les autres événements</strong> (tes rendez-vous perso, ceux de tes clients actuels écrits autrement…) s'affichent <strong>en gris</strong>. <u>Ce ne sont pas des clients</u> : le CRM ne les connaît pas, donc pas de fiche client, pas de chiffre d'affaires, pas de rappel SMS.</div>
    <div style="background:#FFF4E5;color:#8A4B00;border-radius:10px;padding:11px 14px;margin-bottom:10px"><strong>Si tu as déjà des clients dans ton Google Agenda :</strong> clique sur chaque événement gris qui est un vrai rendez-vous client, puis sur « ajouter comme RDV client ». Fais-le <strong>pour tes rendez-vous à venir</strong>, au moins : sans ça, ces clients ne recevront pas de rappel SMS et ne comptent pas dans tes chiffres. Ton ancien historique (avant aujourd'hui) n'est pas importé.</div>
    <p style="margin:0"><strong>Pour la suite :</strong> ajoute tes rendez-vous directement dans le CRM (« + Rendez-vous »), ou écris-les dans Google avec « RDV - … ». Dans les deux cas, ils arrivent tout seuls dans « Mes rendez-vous ».</p>
  </div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">J'ai compris</button></div>`;
  $('modal-overlay').classList.add('open');
}
async function convertGoogleEvent(id){
  const ev = googleOtherEvents.find(e=>e.id===id);
  if(!ev) return;
  const title = (ev.summary||'').trim();
  const parsed = parseRdvTitle(title);
  const name = prompt('Ajouter « '+title+' » comme rendez-vous client ?\n\nNom du client :', parsed.name);
  if(!name || !name.trim()) return;
  parsed.name = name.trim();
  const created = await createRdvFromGoogleEvent(ev, parsed);
  if(!created){ alert('Impossible de créer le rendez-vous, réessaie.'); return; }
  googleOtherEvents = googleOtherEvents.filter(e=>e.id!==id);
  render();
}
// Seuls les événements Google dont le titre commence par "RDV" deviennent de nouveaux RDV/clients dans le CRM (ex. "RDV Dupont — lavage complet")
const GOOGLE_IMPORT_PREFIX = /^\s*rdv\b[\s:\-–—]*/i;
const phoneKey = p => (p||'').replace(/\D/g,'').replace(/^(0033|33)/,'0');
function formatPhone(p){
  const k = phoneKey(p);
  return /^0\d{9}$/.test(k) ? k.replace(/(\d{2})(?=\d)/g,'$1 ').trim() : (p||'').trim();
}
const normTxt = t => (t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
// Lit un titre du type "RDV - Nom Prénom - adresse - prestation - prix" (ordre libre après le nom) et en extrait les infos du RDV
function parseRdvTitle(raw){
  const t = (raw||'').trim().replace(GOOGLE_IMPORT_PREFIX,'');
  const parts = t.split(/\s+[-–—]\s+/).map(x=>x.trim()).filter(Boolean);
  const res = {name: parts[0]||'', adresse:'', prestation:'', montant:null, phone:'', extra:[]};
  // adresse "évidente" : numéro + mot, mot-clé de voie, code postal ou virgule
  const addrRe = /^\d+\s*(bis|ter)?\s+\S|\b(rue|avenue|av|boulevard|bd|chemin|impasse|allee|route|place|quai|cours|residence|lotissement|villa|passage|hameau)\b|\b\d{5}\b|,/i;
  const phoneRe = /^(?:\+|00)?\d[\d\s.\-]{7,16}\d$/;
  let firstFree = true; // la 1re info "libre" après le nom (ni téléphone, ni prix, ni prestation du catalogue) est l'adresse
  parts.slice(1).forEach((p,i)=>{
    if(!res.phone && phoneRe.test(p) && phoneKey(p).length>=9 && phoneKey(p).length<=12){ res.phone = formatPhone(p); return; }
    const price = p.match(/^(\d{1,4}(?:[.,]\d{1,2})?)\s*(?:€|e|eur|euros?)?$/i);
    if(price && res.montant===null){ res.montant = parseFloat(price[1].replace(',','.')); return; }
    const pn = normTxt(p);
    const cat = pn.length>=3 && (D.prestations||[]).find(x=>{ const n=normTxt(x.nom); return n===pn || pn.includes(n) || n.includes(pn); });
    if(cat && !res.prestation){ res.prestation = cat.nom; if(res.montant===null && cat.prix) res._catPrix = cat.prix; return; }
    // ordre habituel : nom - adresse - prestation - prix → le 1er élément après le nom est l'adresse par défaut
    if(!res.adresse && (firstFree || addrRe.test(p))){ res.adresse = p; firstFree=false; return; }
    firstFree=false;
    if(!res.prestation){ res.prestation = p; return; }
    res.extra.push(p);
  });
  if(res.montant===null && res._catPrix) res.montant = res._catPrix;
  return res;
}

async function syncFromGoogleCalendar(){
  if(!googleConnected || !gapiReady || googleSyncInFlight) return;
  // on attend la fin des écritures CRM → Google pour ne pas écraser une modification qui vient d'être faite dans le CRM
  if(googleExportsInFlight>0 || Date.now()-googleLastExportAt < 20000) return;
  googleSyncInFlight = true;
  try {
    await ensureGoogleToken(false);
    if(!googleConnected){ googleSyncInFlight=false; return; }
    const now = new Date();
    const timeMin = new Date(now.getTime() - 7*86400000).toISOString();
    const timeMax = new Date(now.getTime() + 90*86400000).toISOString();
    const resp = await gapi.client.calendar.events.list({
      calendarId: 'primary', timeMin, timeMax, singleEvents: true, orderBy: 'startTime', maxResults: 250, showDeleted: true
    });
    const events = (resp.result && resp.result.items) || [];
    const pad = n => String(n).padStart(2,'0');
    const byGoogleId = new Map(D.interventions.filter(i=>i.google_event_id).map(i=>[i.google_event_id,i]));
    const editingId = (S.selectedInterv || (document.getElementById('modal-overlay')?.classList.contains('open') ? S.form?.editIntervId : null)) || null;
    let changed = 0;
    const others = [];
    for(const ev of events){
      if(!ev.id) continue;
      const linked = byGoogleId.get(ev.id);

      // 1) Événement déjà lié à un RDV du CRM : on répercute les modifications faites dans Google
      if(linked){
        if(linked.statut!=='planifie') continue; // RDV réalisé/annulé : le CRM fait foi
        if(editingId && (linked.id===editingId || linked.id==editingId)) continue; // en cours d'édition dans le CRM
        if(ev.status==='cancelled'){
          const{error}=await sb.from('interventions').update({statut:'annule'}).eq('id',linked.id);
          if(!error){ linked.statut='annule'; changed++; }
          continue;
        }
        if(!ev.start || !ev.start.dateTime) continue;
        const startDt = new Date(ev.start.dateTime);
        const endDt = (ev.end && ev.end.dateTime) ? new Date(ev.end.dateTime) : new Date(startDt.getTime()+60*60000);
        const patch = {
          date: `${startDt.getFullYear()}-${pad(startDt.getMonth()+1)}-${pad(startDt.getDate())}`,
          heure: `${pad(startDt.getHours())}:${pad(startDt.getMinutes())}`,
          duree: Math.max(15, Math.round((endDt-startDt)/60000))
        };
        if(ev.location) patch.adresse = ev.location; // lieu vide dans Google : on garde l'adresse saisie dans le CRM
        const differs = patch.date!==linked.date || patch.heure!==(linked.heure||'').slice(0,5) || patch.duree!==(linked.duree||60) || (patch.adresse!==undefined && patch.adresse!==(linked.adresse||''));
        if(differs){
          const{error}=await sb.from('interventions').update(patch).eq('id',linked.id);
          if(!error){ Object.assign(linked, patch); changed++; }
        }
        continue;
      }

      // 2) Nouvel événement créé dans Google : importé seulement s'il commence par "RDV"
      if(ev.status==='cancelled') continue;
      if(!ev.start || (!ev.start.dateTime && !ev.start.date)) continue;
      const title = (ev.summary||'').trim();
      if(!GOOGLE_IMPORT_PREFIX.test(title)){ if(ev.start.dateTime) others.push(ev); continue; }
      const parsed = parseRdvTitle(title);
      if(!parsed.name) continue;
      byGoogleId.set(ev.id, {}); // évite un double-import si le même événement apparaît deux fois
      const created = await createRdvFromGoogleEvent(ev, parsed);
      if(created) changed++;
    }
    const sig = list => list.map(e=>e.id+'|'+(e.summary||'')+'|'+((e.start&&e.start.dateTime)||'')+'|'+((e.end&&e.end.dateTime)||'')).join(';');
    if(sig(others)!==sig(googleOtherEvents)){ googleOtherEvents = others; changed++; }
    googleLastSyncAt = new Date();
    if(changed>0 && !S.selectedInterv && !document.getElementById('modal-overlay')?.classList.contains('open')) render();
    else refreshGoogleSyncLabel();
  } catch(err){ console.error('Sync depuis Google error:', err); }
  googleSyncInFlight = false;
}

(function(){
  let panX=0, mode=null, lastAt=0, settleTimer=null, animating=false, quietNeeded=false, peak=0;
  const tracks = () => [document.getElementById('wk-head'),document.getElementById('wk-body')].filter(Boolean);
  const width = () => { const c=document.querySelector('.week-clip'); return c?c.clientWidth:0; };
  function setX(x, anim){
    tracks().forEach(t=>{
      t.style.transition = anim ? 'transform .28s cubic-bezier(.22,.8,.3,1)' : 'none';
      t.style.transform = `translateX(calc(-33.3333% + ${x}px))`;
    });
  }
  window.goWeek = function(dir){ // +1 = semaine suivante, -1 = précédente
    const W=width();
    if(!W){ dir>0 ? weekNext() : weekPrev(); return; }
    if(animating) return;
    animating=true; clearTimeout(settleTimer); settleTimer=null;
    setX(-dir*W, true);
    setTimeout(()=>{ animating=false; panX=0; peak=0; quietNeeded=true; dir>0 ? weekNext() : weekPrev(); }, 290);
  };
  function settle(){
    settleTimer=null;
    const W=width(); const x=panX; mode=null;
    if(!W){ panX=0; peak=0; return; }
    const commit = Math.abs(x) > W*0.15 || (peak>=25 && Math.abs(x)>40);
    peak=0;
    if(commit){ panX=x; goWeek(x<0 ? 1 : -1); }
    else { panX=0; setX(0,true); }
  }
  window.addEventListener('wheel', e=>{
    if(typeof S==='undefined' || S.page!=='agenda') return;
    if(!e.target.closest || !e.target.closest('#main')) return;
    if(e.target.closest('input,textarea,select')) return;
    if(window.__dragState) return;
    const ov=document.getElementById('modal-overlay'); if(ov && ov.classList.contains('open')) return;
    const k = e.deltaMode===1 ? 16 : 1;
    const useShift = e.shiftKey && !e.deltaX;
    const dx=(useShift ? e.deltaY : e.deltaX)*k, dy=(useShift ? 0 : e.deltaY)*k;
    const now=Date.now(), gap=now-lastAt; lastAt=now;
    if(gap>120 && !settleTimer){ mode=null; }       // nouveau geste
    if(quietNeeded){ if(gap>120){ quietNeeded=false; } else { if(Math.abs(dx)>Math.abs(dy)) e.preventDefault(); return; } } // on ignore l'inertie qui suit un changement de semaine
    if(mode===null) mode = Math.abs(dx) > Math.abs(dy)*1.2 ? 'h' : 'v';
    if(mode==='v') return;                            // geste vertical : défilement normal des heures
    e.preventDefault();                                // empêche aussi le "retour arrière" du navigateur
    if(animating) return;
    const W=width(); if(!W) return;
    panX = Math.max(-W, Math.min(W, panX - dx));      // la grille suit les doigts
    peak = Math.max(peak, Math.abs(dx));
    setX(panX,false);
    clearTimeout(settleTimer);
    settleTimer=setTimeout(settle, 90);               // plus aucun mouvement : on se cale sur la semaine
  }, {passive:false, capture:true});
  document.addEventListener('keydown', e=>{
    if(typeof S==='undefined' || S.page!=='agenda' || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
    if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
    if(e.target.closest && e.target.closest('input,textarea,select,[contenteditable]')) return;
    const ov=document.getElementById('modal-overlay'); if(ov && ov.classList.contains('open')) return;
    e.preventDefault();
    goWeek(e.key==='ArrowRight' ? 1 : -1);
  });
})();

const bookingExportBusy=new Set();
async function pollBookings(){
  if(!currentUser||!D.interventions) return;
  try{
    const today=new Date().toISOString().slice(0,10);
    const{data}=await sb.from('interventions').select('*').eq('user_id',currentUser.id).ilike('infos_complementaires','%Réservation en ligne%').gte('date',today).limit(200);
    const known=new Set(D.interventions.map(i=>String(i.id)));
    const fresh=(data||[]).filter(i=>!known.has(String(i.id)));
    if(fresh.length){
      for(const i of fresh){ D.interventions.push(i); }
      // le prospect vient d'être créé / passé en client côté serveur : on recharge les clients pour le voir tout de suite
      try{ const cl=await sb.from('clients').select('*').eq('user_id',currentUser.id); if(cl.data) D.clients=cl.data; }catch(e){}
      S.bookingNotices=(S.bookingNotices||[]).concat(fresh.map(i=>({id:i.id,name:i.client_name,date:i.date,heure:i.heure})));
      if(!document.getElementById('modal-overlay')?.classList.contains('open')) render();
    }
    if(googleConnected&&gapiReady){
      const todo=D.interventions.filter(i=>(i.statut||'realise')==='planifie'&&!i.google_event_id&&String(i.date||'').slice(0,10)>=today&&!bookingExportBusy.has(i.id));
      for(const i of todo){ bookingExportBusy.add(i.id); try{ await autoExportToGoogle(i); }finally{ bookingExportBusy.delete(i.id); } }
    }
  }catch(e){ console.error('pollBookings', e); }
}

// Répartit les RDV qui se chevauchent en colonnes côte à côte (comme Google Agenda)
function layoutDayBlocks(items){
  const sorted=items.slice().sort((x,y)=>x.s-y.s||y.e-x.e);
  const out=[]; let cluster=[], clusterEnd=-1, colsEnd=[];
  const flush=()=>{ const n=colsEnd.length; cluster.forEach(c=>{c.n=n;}); out.push(...cluster); cluster=[]; colsEnd=[]; clusterEnd=-1; };
  for(const it of sorted){
    if(cluster.length && it.s>=clusterEnd) flush();
    let col=colsEnd.findIndex(e=>e<=it.s);
    if(col===-1){ col=colsEnd.length; colsEnd.push(it.e); } else colsEnd[col]=it.e;
    it.col=col; cluster.push(it); clusterEnd=Math.max(clusterEnd,it.e);
  }
  if(cluster.length) flush();
  return out;
}
// Rend une colonne "jour" complète (00:00-23:30). Les créneaux libres sont toujours présents sous les RDV (pour glisser un 2e RDV au même horaire).
function renderDaySlots(day, bookingClientId){
  const clientArg = bookingClientId?`'${bookingClientId}'`:'null';
  const statutBg={planifie:'var(--blue-mid)',realise:'#7BC96F'};
  const items=[];
  intervOn(day.d, day.m, day.y).filter(i=>i.statut!=='annule').forEach(i=>{ const s=timeToMin(i.heure); items.push({kind:'crm',ref:i,s,e:Math.min(1440,s+(i.duree||60))}); });
  googleOnDay(day.y, day.m, day.d).forEach(g=>{ const s=timeToMin(g.heure); items.push({kind:'g',ref:g,s,e:Math.min(1440,s+g.duree)}); });
  let slots='';
  for(let t=SLOT_START; t<SLOT_END; t+=SLOT_STEP){
    // trait plein et foncé = heure pile, pointillé léger = demi-heure
    const lineStyle = (t%60===30) ? '1px solid rgba(0,0,0,.22)' : '1px dotted rgba(0,0,0,.16)';
    slots+=`<div class="agenda-slot" data-y="${day.y}" data-m="${day.m}" data-d="${day.d}" data-t="${t}" onmousedown="startSlotDrag(event,${day.y},${day.m},${day.d},${t},${clientArg})" style="height:${SLOT_PX}px;box-sizing:border-box;border-bottom:${lineStyle};cursor:pointer" onmouseover="if(!window.__dragState)this.style.background='var(--blue-light)'" onmouseout="if(!window.__dragState)this.style.background='transparent'"></div>`;
  }
  const GUT=12; // bande libre à droite : on peut y glisser pour ajouter un RDV sur un horaire déjà pris
  const blocks=layoutDayBlocks(items).map(it=>{
    const top=Math.round(it.s/SLOT_STEP*SLOT_PX), h=Math.max(10,Math.round((it.e-it.s)/SLOT_STEP*SLOT_PX)-1);
    const pos=`position:absolute;top:${top}px;height:${h}px;left:calc((100% - ${GUT}px) * ${it.col} / ${it.n});width:calc((100% - ${GUT}px) / ${it.n} - 2px);box-sizing:border-box;overflow:hidden;cursor:pointer;line-height:1.25;border-radius:4px;font-size:10px;padding:2px 4px;word-break:break-word`;
    const mdown=`onmousedown="blockMouseDown(event,${day.y},${day.m},${day.d},${clientArg})"`;
    if(it.kind==='g'){
      const g=it.ref; const gt=(g.title||'').length>22?g.title.slice(0,22)+'…':g.title;
      return `<div class="agenda-ev" ${mdown} title="${(g.title||'').replace(/"/g,'&quot;')} — clique pour l'ajouter comme RDV client" onclick="event.stopPropagation();convertGoogleEvent('${g.id}')" style="${pos};background:var(--gray-border-mid,#d2d2d7);color:#515154;font-weight:500;border:1px dashed #aeaeb2">${minToTime(it.s)} ${gt}</div>`;
    }
    const occ=it.ref;
    const shortName=(occ.client_name||'—').length>15?occ.client_name.slice(0,15)+'…':(occ.client_name||'—');
    const isSel = S.selectedInterv===occ.id;
    return `<div class="agenda-ev" ${mdown} onclick="event.stopPropagation();selectInterv('${occ.id}',this)" ondblclick="event.stopPropagation();editIntervention('${occ.id}')" style="${pos};background:${statutBg[occ.statut]||'var(--text-tertiary)'};color:#fff;font-weight:600${isSel?';box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue-dark);z-index:2':''}">${minToTime(it.s)} ${shortName}</div>`;
  }).join('');
  const band = SLOT_PX*2; // une heure sur deux est légèrement teintée pour mieux repérer les heures
  return `<div style="position:relative;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent ${band}px,rgba(0,0,0,.028) ${band}px,rgba(0,0,0,.028) ${band*2}px)">${slots}${blocks}</div>`;
}
// Sélection légère d'un RDV dans l'agenda : affiche un popover éditable ancré sur le créneau cliqué, sans bloquer l'écran.
function selectInterv(id, el){
  if(S.selectedInterv===id){ S.selectedInterv=null; S.selectedIntervPos=null; return render(); }
  const i = D.interventions.find(x=>x.id===id||x.id==id);
  if(!i) return;
  S.selectedInterv = id;
  if(el && el.getBoundingClientRect){
    const r = el.getBoundingClientRect();
    const popW=340, margin=10;
    const popHMax = window.innerHeight*0.8; // doit rester cohérent avec le max-height:80vh de la carte
    let left = r.right + margin;
    if(left + popW > window.innerWidth - margin) left = r.left - popW - margin;
    if(left < margin) left = Math.min(r.left, window.innerWidth - popW - margin);
    left = Math.max(margin, left);
    // La carte peut atteindre jusqu'à popHMax de haut : on garde toujours assez de place en dessous de "top" pour ça
    let top = Math.min(r.top, window.innerHeight - popHMax - margin);
    top = Math.max(margin, top);
    S.selectedIntervPos = {left:Math.round(left), top:Math.round(top)};
  } else {

function toggleOptionState(id, prix){

// Glisser-déposer dans la grille Agenda pour sélectionner visuellement la durée d'un RDV
function startSlotDrag(ev,y,m,d,t,clientId){
  ev.preventDefault();
  document.body.classList.add('slot-dragging');
  window.__dragState = {y,m,d,startT:t,endT:t,clientId};
  document.addEventListener('mousemove', dragSlotMove);
  document.addEventListener('mouseup', dragSlotEnd, {once:true});
  paintDragRange();
}
function dragSlotMove(ev){
  const st=window.__dragState; if(!st) return;
  const el=document.elementFromPoint(ev.clientX, ev.clientY);
  const slot=el && el.closest ? el.closest('.agenda-slot') : null;
  if(slot && +slot.dataset.y===st.y && +slot.dataset.m===st.m && +slot.dataset.d===st.d){
    st.endT = +slot.dataset.t;
    paintDragRange();
  }
}
function paintDragRange(){
  const st=window.__dragState; if(!st) return;
  const lo=Math.min(st.startT,st.endT), hi=Math.max(st.startT,st.endT);
  document.querySelectorAll('.agenda-slot').forEach(el=>{
    if(+el.dataset.y===st.y && +el.dataset.m===st.m && +el.dataset.d===st.d){
      const t=+el.dataset.t;
      el.style.background = (t>=lo&&t<=hi) ? 'var(--blue)' : 'transparent';
    }
  });
}
// Mousedown sur un RDV existant : un simple clic l'édite, mais si on glisse on crée un 2e RDV sur ces horaires
function blockMouseDown(ev,y,m,d,clientId){
  if(ev.button!==0 || window.__dragState) return;
  const sx=ev.clientX, sy=ev.clientY;
  const slot=document.elementsFromPoint(sx,sy).find(el=>el.classList&&el.classList.contains('agenda-slot'));
  if(!slot) return;
  const t0=+slot.dataset.t;
  const onUp=()=>{ document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); };
  const onMove=e=>{
    if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)<6) return;
    onUp();
    window.__eatClick=e2=>{ e2.stopPropagation(); e2.preventDefault(); };
    document.addEventListener('click',window.__eatClick,true);
    startSlotDrag({preventDefault(){}}, y,m,d,t0,clientId);
  };
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}
function dragSlotEnd(){
  document.removeEventListener('mousemove', dragSlotMove);
  document.body.classList.remove('slot-dragging');
  if(window.__eatClick){ const f=window.__eatClick; window.__eatClick=null; setTimeout(()=>document.removeEventListener('click',f,true),0); }
  const st=window.__dragState; window.__dragState=null;
  if(!st) return;
  const lo=Math.min(st.startT,st.endT), hi=Math.max(st.startT,st.endT);
  const duree = hi-lo+SLOT_STEP;
  openInterventionFor(st.clientId, {d:st.d,m:st.m,y:st.y}, minToTime(lo), duree);
}

function openInterventionFor(clientId, day, heure, duree){

    const c = D.clients.find(x=>x.id===clientId||x.id==clientId);
    S.form.clientId = clientId; S.form.newClient=false; S.form.clientSearch = c?.name||'';
    S.form.adresse = c?.adresse_postale||'';
  }
  $('modal-content').innerHTML = mIntervention();
  $('modal-overlay').classList.add('open');
}

  S.bookingForClient = {id:clientId, name:clientName};
  nav('agenda');
}

// ----- Admin : retour des clients à Meta (Conversions API pour CRM) -----
function adminMetaCard(ad){
  const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  const who=uid=>{ const p=(ad.profiles||[]).find(x=>x.id===uid); return p?(`${p.prenom||''} ${p.nom||''}`.trim()||p.identifiant||'—'):'—'; };
  const cfgs=ad.metaCfg||[], evs=ad.metaEv||[];
  const stCol={sent:['#EAF7EC','#1D6B2E','Envoyé'],pending:['#E6F1FB','#0071E3','En attente'],failed:['#fde8e8','#c0392b','Échec']};
  const rows=cfgs.length===0?'<div style="font-size:13px;color:#999;padding:6px 0">Aucun élève configuré.</div>':cfgs.map(c=>`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;border:0.5px solid #e5e5e5;border-radius:10px;padding:9px 12px;margin-bottom:8px;font-size:13px"><strong style="min-width:140px">${esc(who(c.user_id))}</strong><span style="font-family:monospace">${esc(c.dataset_id)}</span><span style="color:#1D6B2E">jeton ✓</span>${c.test_event_code?`<span style="background:#FFF4E5;color:#8A4B00;border-radius:100px;padding:2px 9px;font-size:11.5px">mode test : ${esc(c.test_event_code)}</span>`:''}<span style="background:${c.enabled?'#EAF7EC':'#f0f0f0'};color:${c.enabled?'#1D6B2E':'#666'};border-radius:100px;padding:2px 9px;font-size:11.5px;font-weight:600">${c.enabled?'Actif':'Désactivé'}</span><button onclick="adminMetaEdit('${c.user_id}')" style="margin-left:auto;background:#f0f0f0;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px">Modifier</button></div>`).join('');
  const log=evs.length===0?'<div style="font-size:13px;color:#999;padding:6px 0">Aucun événement envoyé pour l\'instant.</div>':`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px"><thead><tr style="color:#888;text-align:left"><th style="padding:5px 8px">Date</th><th style="padding:5px 8px">Élève</th><th style="padding:5px 8px">Étape</th><th style="padding:5px 8px">Statut</th><th style="padding:5px 8px">Réponse de Meta</th></tr></thead><tbody>${evs.map(e=>{const b=stCol[e.status]||stCol.pending; return `<tr style="border-top:0.5px solid #eee"><td style="padding:5px 8px;white-space:nowrap">${new Date(e.created_at).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td style="padding:5px 8px">${esc(who(e.user_id))}</td><td style="padding:5px 8px"><strong>${esc(e.stage)}</strong></td><td style="padding:5px 8px"><span style="background:${b[0]};color:${b[1]};border-radius:100px;padding:2px 9px;font-size:11.5px;font-weight:600">${b[2]}</span></td><td style="padding:5px 8px;color:#666;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(e.response)}">${esc(e.http_status||'')} ${esc(e.response||'')}</td></tr>`;}).join('')}</tbody></table></div>`;
  return `<div style="background:white;border-radius:12px;border:0.5px solid #e5e5e5;padding:1.25rem;margin-top:1.5rem">
    <div style="font-size:15px;font-weight:600;margin-bottom:.25rem">📈 Meta — retour des clients (Conversions API)</div>
    <div style="font-size:12px;color:#888;margin-bottom:1rem">Quand un prospect Facebook change de statut dans le CRM (contacté, client…), Meta est prévenu pour mieux optimiser les publicités. Il faut l'identifiant du jeu de données (dataset / pixel) de l'élève et un jeton d'accès.</div>
    ${rows}
    <div style="border-top:0.5px solid #eee;padding-top:12px;margin-top:6px"><div style="font-size:12px;color:#666;margin-bottom:6px">Configurer un élève :</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select id="meta-user" style="padding:6px 8px;border:0.5px solid #ddd;border-radius:6px;font-size:12.5px"><option value="">Choisir un élève…</option>${(ad.profiles||[]).map(p=>`<option value="${p.id}">${esc(((p.prenom||'')+' '+(p.nom||'')).trim()||p.identifiant)}</option>`).join('')}</select>
        <input id="meta-dataset" placeholder="Dataset / Pixel ID" style="width:170px;padding:6px 10px;border:0.5px solid #ddd;border-radius:6px;font-size:12.5px">
        <input id="meta-token" type="password" autocomplete="off" placeholder="Jeton d'accès (laisser vide = inchangé)" style="width:230px;padding:6px 10px;border:0.5px solid #ddd;border-radius:6px;font-size:12.5px">
        <input id="meta-test" placeholder="Code test (optionnel)" style="width:150px;padding:6px 10px;border:0.5px solid #ddd;border-radius:6px;font-size:12.5px">
        <label style="display:flex;align-items:center;gap:5px;font-size:12.5px"><input id="meta-on" type="checkbox" checked> Actif</label>
        <button onclick="adminMetaSave()" style="background:#0071E3;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:500">Enregistrer</button></div></div>
    <div style="border-top:0.5px solid #eee;padding-top:12px;margin-top:14px"><div style="font-size:12px;color:#666;margin-bottom:6px">Derniers événements envoyés à Meta :</div>${log}</div></div>`;
}
function adminMetaEdit(uid){
  const c=((window.adminData&&window.adminData.metaCfg)||[]).find(x=>x.user_id===uid); if(!c) return;
  document.getElementById('meta-user').value=uid; document.getElementById('meta-dataset').value=c.dataset_id||''; document.getElementById('meta-token').value='';
  document.getElementById('meta-test').value=c.test_event_code||''; document.getElementById('meta-on').checked=!!c.enabled;
  document.getElementById('meta-dataset').focus();
}
async function adminMetaSave(){

function hardSignOut(){

  try{ Object.keys(localStorage).filter(k=>k.startsWith('sb-')).forEach(k=>localStorage.removeItem(k)); }catch(e){}
  return Promise.race([Promise.all([out]),done]);
}
