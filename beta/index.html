function printDoc(id){
  const doc = D.factures.find(f=>f.id===id);
  if(!doc) return;
  S.previewDocId=id;
  render();
  setTimeout(()=>{
    const el = document.getElementById('doc-preview');
    if(!el) return;
    const w = window.open('','_blank');
    w.document.write('<html><head><title>'+doc.numero+'</title><style>body{font-family:-apple-system,sans-serif;margin:0;padding:20px}@media print{body{margin:0}}</style></head><body>');
    w.document.write(el.outerHTML);
    w.document.write('</body></html>');
    w.document.close();
    w.focus();
    setTimeout(()=>w.print(), 500);
  }, 300);
}

function convertToFacture(id){
  const doc = D.factures.find(f=>f.id===id);
  if(!doc) return;
  doc.type='facture'; doc.statut='attente';
  const num = 'FA-'+new Date().getFullYear()+'-'+String(D.nextFactureNum++).padStart(3,'0');
  doc.numero=num;
  try{localStorage.setItem('ecolia_factures_'+currentUser.id,JSON.stringify(D.factures));}catch(e){}
  render();
}

function markPaid(id){const doc=D.factures.find(f=>f.id===id);if(!doc)return;doc.statut='paye';try{localStorage.setItem('ecolia_factures_'+currentUser.id,JSON.stringify(D.factures));}catch(e){}render();} function delDoc(id){
  if(!confirm('Supprimer ce document ?')) return;
  D.factures=D.factures.filter(f=>f.id!==id);
  try{localStorage.setItem('ecolia_factures_'+currentUser.id,JSON.stringify(D.factures));}catch(e){}
  S.previewDocId=null; S.editDocId=null;
  render();
}

function editDoc(id){ S.editDocId=id; S.previewDocId=null; S.formDoc=null; render(); }

async function savePrestation(){
  if(!S.form.nom?.trim()){ alert('Nom requis.'); return; }
  const fields = {nom:S.form.nom.trim(), description:S.form.description||'', prix:parseFloat(S.form.prix)||0, duree:parseInt(S.form.duree)||60};
  if(S.form.editPrestId){
    const{error}=await sb.from('prestations').update(fields).eq('id',S.form.editPrestId);
    if(error){alert('Erreur: '+error.message);return;}
    const idx = D.prestations.findIndex(p=>p.id===S.form.editPrestId);
    if(idx>=0) D.prestations[idx]={...D.prestations[idx],...fields};
  } else {
    const row={user_id:currentUser.id,...fields};
    const{data,error}=await sb.from('prestations').insert(row).select().single();
    if(error){alert('Erreur: '+error.message);return;}
    if(data) D.prestations.push(data);
  }
  closeModal(); render();
}

async function delPrestation(id){if(!confirm('Supprimer ?'))return;await sb.from('prestations').delete().eq('id',id);D.prestations=D.prestations.filter(p=>p.id!==id&&p.id!=id);render();} function editPrestation(id){
  const p = D.prestations.find(x=>x.id===id||x.id==id);
  if(!p) return;
  S.form = {editPrestId:p.id, nom:p.nom, description:p.description||'', prix:p.prix||0, duree:p.duree||60};
  $('modal-content').innerHTML = mPrestation();
  $('modal-overlay').classList.add('open');
}

function loadFactures(){
  D.factures=[]; D.nextFactureNum=1;
  try{
    const saved = localStorage.getItem('ecolia_factures_'+currentUser.id);
    if(saved) D.factures = JSON.parse(saved);
    const num = localStorage.getItem('ecolia_facturenum_'+currentUser.id);
    if(num) D.nextFactureNum = parseInt(num);
  }catch(e){}
}

function nav(p){
  if(p==='agenda') S.calScrollTop=null; // en ouvrant l'Agenda, on repart de l'heure d'ouverture (7h)
  S.page=p;S.openModuleId=null;closeSidebar();
  ['dashboard','crm','agenda','prestations_hist','formation'].forEach(id=>{const el=$('mn-'+id);if(el)el.classList.toggle('active',id===p||(id==='formation'&&['formation'].includes(p)))});
  render();
  if(p==='agenda' && googleConnected && gapiReady) syncFromGoogleCalendar();
  if(p==='sms') loadSms().then(()=>{ if(S.page==='sms') renderPage(); $('sidebar').innerHTML=renderSidebar(); });
}

async function logout(){
  await hardSignOut();
  currentUser=null;currentProfile=null;D={events:[],clients:[],depenses:[],kpis:[],quizState:{},factures:[],prestations:[{id:1,nom:'Nettoyage intérieur',prix:80,description:''},{id:2,nom:'Nettoyage extérieur',prix:60,description:''},{id:3,nom:'Nettoyage complet',prix:130,description:''},{id:4,nom:'Protection céramique',prix:250,description:''},{id:5,nom:'Polish / Correction',prix:180,description:''}],options:[],profil:{siret:'',nom_entreprise:'',adresse:'',telephone:'',email_pro:'',logo:null,couleur:'#0071E3',iban:''},nextFactureNum:1};
  const mn=$('mobile-nav');if(mn)mn.style.display='none';
  renderLogin();
}

function openSidebar(){const sb2=$('sidebar'),ov=$('sidebar-overlay');if(sb2)sb2.classList.add('open');if(ov)ov.classList.add('show')}
function closeSidebar(){const sb2=$('sidebar'),ov=$('sidebar-overlay');if(sb2)sb2.classList.remove('open');if(ov)ov.classList.remove('show')}
function calPrev(){if(S.cal.month===0){S.cal.month=11;S.cal.year--;}else S.cal.month--;render()}
function calNext(){if(S.cal.month===11){S.cal.month=0;S.cal.year++;}else S.cal.month++;render()}
function calDay(d){S.cal.sel={d,m:S.cal.month,y:S.cal.year};render()}
function openMod(id){S.openModuleId=id;S.activeTab='videos';render()}
function closeMod(){S.openModuleId=null;render()}
function setTab(t){S.activeTab=t;render()}

// Heure affichée en haut de la grille quand on ouvre l'Agenda (les créneaux de nuit restent accessibles en remontant)
const AGENDA_OPEN_HOUR = 7;
function renderPage(){
  const pages={sms_campaign:pageSmsCampaign,booking:pageBooking,dashboard:pageDashboard,crm:pageCRM,agenda:pageCalendar,sms:pageSms,tasks_page:pageTasksAll,prestations_hist:pagePrestationsHist,compta:pageCompta,formation:pageFormation,depenses:pageDepenses,kpifb:pageKpiFb,profil:pageProfil};
  $('main').innerHTML=(pages[S.page]||pageDashboard)();
  if(S.page==='agenda'){
    const sc=document.querySelector('.week-body-scroll');
    if(sc) sc.scrollTop = (S.calScrollTop!=null) ? S.calScrollTop : AGENDA_OPEN_HOUR*2*SLOT_PX; // on garde la position choisie par l'utilisateur d'un affichage à l'autre
  }
}
// mémorise la position verticale de la grille (le scroll ne "remonte" donc plus à minuit à chaque changement de semaine)
document.addEventListener('scroll', e=>{
  const t=e.target;
  if(t && t.classList && t.classList.contains('week-body-scroll')) S.calScrollTop=t.scrollTop;
}, true);
function render(){
  $('sidebar').innerHTML=renderSidebar();
  renderPage();
  ['dashboard','crm','agenda','prestations_hist','formation'].forEach(id=>{const el=$('mn-'+id);if(el)el.classList.toggle('active',S.page===id||(id==='formation'&&['formation'].includes(S.page)))});
}

};

// Prompt installation sur Android
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

function showInstallBanner(){
  if(document.getElementById('install-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'install-banner';
  banner.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#0071E3;color:white;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:600;cursor:pointer;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,0.2);display:flex;align-items:center;gap:8px;font-family:-apple-system,sans-serif;white-space:nowrap';
  banner.textContent = 'Installer Académie';
  banner.onclick = async () => {
    if(deferredPrompt){ deferredPrompt.prompt(); const r = await deferredPrompt.userChoice; deferredPrompt=null; }
    banner.remove();
  };
  document.body.appendChild(banner);
  setTimeout(()=>banner.remove(), 8000);
}

// Suppression rapide au clavier du RDV sélectionné dans l'agenda (touche Suppr/Backspace)
document.addEventListener('keydown', e=>{
  if(!S.selectedInterv) return;
  if(e.key!=='Delete' && e.key!=='Backspace') return;
  const tag = (document.activeElement && document.activeElement.tagName)||'';
  if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT' || (document.activeElement && document.activeElement.isContentEditable)) return;
  e.preventDefault();
  delIntervention(S.selectedInterv);
});

// ═══════════════════════════════════
// BOOT
// ═══════════════════════════════════
(async function boot(){
  showLoading('Initialisation...');
  // Si la session enregistrée dans le navigateur est bloquée, on ne reste pas coincé : après 8 s on l'efface et on affiche la connexion
  let session=null;
  try{
    const r=await Promise.race([sb.auth.getSession(), new Promise(res=>setTimeout(()=>res('timeout'),8000))]);
    if(r==='timeout'){
      try{ Object.keys(localStorage).filter(k=>k.startsWith('sb-')).forEach(k=>localStorage.removeItem(k)); }catch(e){}
    } else session=r.data&&r.data.session;
  }catch(e){ session=null; }
  if(session){
    currentUser=session.user;
    await loadProfileAndStart();
  } else {
    renderLogin();
  }
  // Écouter les changements de session
  sb.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'){currentUser=null;currentProfile=null;renderLogin();}
  });
})();
</script>
