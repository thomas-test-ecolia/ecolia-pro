function checkPwStrength(pw){
  const bar=$('pw-bar');if(!bar)return;
  let s=0;
  if(pw.length>=6)s++;if(pw.length>=10)s++;
  if(/[A-Z]/.test(pw))s++;if(/[0-9]/.test(pw))s++;if(/[^a-zA-Z0-9]/.test(pw))s++;
  bar.style.width=(s*20)+'%';
  bar.style.background=['','#E24B4A','#EF9F27','#EF9F27','#3B6D11','#3B6D11'][s]||'#E24B4A';
}

async function doLogin(){
  const email=$('login-email').value.trim();
  const pw=$('login-pw').value;
  const btn=$('login-submit-btn');
  const err=$('login-error');
  err.classList.remove('show');
  if(!email||!pw){err.textContent='Email et mot de passe requis.';err.classList.add('show');return;}
  btn.disabled=true;btn.textContent='Connexion...';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){err.textContent='Email ou mot de passe incorrect.';err.classList.add('show');btn.disabled=false;btn.textContent='Se connecter';return;}
  currentUser=data.user;
  await loadProfileAndStart();
}

async function doRegister(){
  const prenom=$('reg-prenom').value.trim();
  const nom=$('reg-nom').value.trim();
  const age=parseInt($('reg-age').value);
  const identifiant=$('reg-id').value.trim().toLowerCase().replace(/\s+/g,'');
  const email=$('reg-email').value.trim();
  const pw=$('reg-pw').value;
  const pw2=$('reg-pw2').value;
  const btn=$('reg-submit-btn');
  const err=$('reg-error');
  const suc=$('reg-success');
  err.classList.remove('show');suc.classList.remove('show');

  if(!prenom||!nom){err.textContent='Prénom et nom requis.';err.classList.add('show');return;}
  if(!age||age<16){err.textContent='Âge invalide (minimum 16 ans).';err.classList.add('show');return;}
  if(!identifiant||identifiant.length<3){err.textContent='Identifiant trop court (min. 3 caractères).';err.classList.add('show');return;}
  if(!email||!email.includes('@')){err.textContent='Email invalide.';err.classList.add('show');return;}
  if(pw.length<6){err.textContent='Mot de passe trop court (min. 6 caractères).';err.classList.add('show');return;}
  if(pw!==pw2){err.textContent='Les mots de passe ne correspondent pas.';err.classList.add('show');return;}

  btn.disabled=true;btn.textContent='Création du compte...';

  // Vérifier si identifiant déjà pris
  const {data:existing}=await sb.from('profiles').select('id').eq('identifiant',identifiant).maybeSingle();
  if(existing){err.textContent='Cet identifiant est déjà utilisé.';err.classList.add('show');btn.disabled=false;btn.textContent='Créer mon compte';return;}

  // Créer le compte Supabase Auth
  const {data,error}=await sb.auth.signUp({email,password:pw});
  if(error){err.textContent=error.message==='User already registered'?'Un compte existe déjà avec cet email.':error.message;err.classList.add('show');btn.disabled=false;btn.textContent='Créer mon compte';return;}

  // Créer le profil avec email
  await sb.from('profiles').insert({id:data.user.id,identifiant,prenom,nom,age,role:'eleve',email});
  
  // Créer un abonnement actif par défaut
  await sb.from('abonnements').insert({user_id:data.user.id,statut:'actif',message:''});

  suc.textContent='Compte créé avec succès ! Tu peux maintenant te connecter.';
  suc.classList.add('show');
  btn.disabled=false;btn.textContent='Créer mon compte';
  setTimeout(()=>switchTab('login'),2500);
}

  const {data:profile}=await sb.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
  currentProfile=profile;

  // Check if admin
  if(currentUser.email === ADMIN_EMAIL){
    await loadAdminData(); // renderAdmin is called inside loadAdminData
    return;
  }

  // Check subscription status
  const {data:sub}=await sb.from('abonnements').select('*').eq('user_id',currentUser.id).maybeSingle();
  if(sub && sub.statut==='suspendu'){
    renderSuspended(sub.message);
    return;
  }

  await loadAllData();
  renderApp();
}

async function loadAdminData(){
  showLoading('Chargement panneau admin...');
  try {
    const [profiles, subs, smsAcc, tiers, cfg, senders, metaCfg, metaEv] = await Promise.all([
      sb.from('profiles').select('*').limit(200),
      sb.from('abonnements').select('*').limit(200),
      sb.rpc('sms_admin_list'),
      sb.from('sms_price_tiers').select('*').order('min_sms'),
      sb.from('app_config').select('*'),
      sb.from('sms_sender_requests').select('*').order('updated_at',{ascending:false}),
      sb.rpc('meta_admin_list'),
      sb.from('meta_capi_events').select('*').order('id',{ascending:false}).limit(30),
    ]);
    const cfgMap = {}; (cfg.data||[]).forEach(c=>{ cfgMap[c.key]=c.value; });
    window.adminData = {
      profiles: profiles.data||[],
      subs: subs.data||[],
      sms: smsAcc.data||[],
      tiers: tiers.data||[],
      senders: (senders&&senders.data)||[],
      metaCfg: (metaCfg&&metaCfg.data)||[],
      metaEv: (metaEv&&metaEv.data)||[],
      cfg: cfgMap
    };
  } catch(e) {
    console.error('Admin load error:', e);
    window.adminData = { profiles: [], subs: [], sms: [], tiers: [], senders: [], metaCfg: [], metaEv: [], cfg: {} };
  }
  renderAdmin();
}

  D.depenses=dep.data||[];
  D.kpis=kpi.data||[];
  D.interventions=interv.data||[];
  D.tasks=tsk.data||[];
  D.quizState={};
  (qz.data||[]).forEach(q=>{D.quizState[q.module_id]={ans:q.answers||{},sub:q.submitted||false,dbId:q.id}});
  D.prestations=prest.data||[];
  D.options=opt.data||[];
  if(D.prestations.length===0){
    // Première utilisation : on amorce le catalogue avec des prestations types par défaut
    const defaults=[
      {nom:'Nettoyage intérieur',prix:80,duree:90,description:'Aspirateur, shampoing, plastiques'},
      {nom:'Nettoyage extérieur',prix:60,duree:60,description:'Lavage carrosserie, jantes, vitres'},

    const seeded=await sb.from('prestations').insert(defaults).select();
    D.prestations=seeded.data||[];

// CA vient du champ 'ca' de la fiche client (saisi manuellement)
function getClientCA(clientName){
  // Somme de toutes les interventions du client
  return D.interventions.filter(i=>i.client_name===clientName).reduce((s,i)=>s+(i.montant||0),0);
}
function getTotalCA(){
  return D.interventions.reduce((s,i)=>s+(i.montant||0),0);
}
function getMonthCA(year, month){
  // Si year/month fournis, calcule pour ce mois spécifique
  // Sinon utilise le mois courant
  const y = year !== undefined ? year : new Date().getFullYear();
  const m = month !== undefined ? month : new Date().getMonth();
  const prefix = y+'-'+String(m+1).padStart(2,'0');
  return D.interventions.filter(i=>i.date&&i.date.startsWith(prefix)).reduce((s,i)=>s+(i.montant||0),0);
}
function getWeekCA(){
  const now=new Date();
  const dayOfWeek=now.getDay()===0?6:now.getDay()-1;
  const weekStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dayOfWeek);
  const weekEnd=new Date(weekStart.getTime()+7*24*60*60*1000);
  return D.interventions.filter(i=>{
    if(!i.date) return false;
    const d=new Date(i.date);
    return d>=weekStart&&d<weekEnd;
  }).reduce((s,i)=>s+(i.montant||0),0);
}
function getWeekClients(){
  const now=new Date();
  const dayOfWeek=now.getDay()===0?6:now.getDay()-1;
  const weekStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dayOfWeek);
  const weekEnd=new Date(weekStart.getTime()+7*24*60*60*1000);
  const clientIds=new Set(D.interventions.filter(i=>{
    if(!i.date) return false;
    const d=new Date(i.date);
    return d>=weekStart&&d<weekEnd;
  }).map(i=>i.client_name));
  return D.clients.filter(c=>clientIds.has(c.name));
}
function getMonthClients(){
  const now=new Date();
  const prefix=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const clientIds=new Set(D.interventions.filter(i=>i.date&&i.date.startsWith(prefix)).map(i=>i.client_name));
  return D.clients.filter(c=>clientIds.has(c.name));
}

function coachIssues(){
  const today=kpiParis(Date.now()), now=Date.now(), out=[];
  const byId={}; (D.clients||[]).forEach(c=>{ byId[String(c.id)]=c; });
  const iv=D.interventions||[];
  const past=iv.filter(i=>(i.statut||'realise')==='planifie'&&i.date&&String(i.date).slice(0,10)<today).length;
  if(past) out.push({n:past,t:`rendez-vous passé${past>1?'s':''} à valider`,why:"Marque-les « réalisés » (✔ dans l'agenda). Sinon ils ne comptent pas dans ton CA ni dans tes KPI, et tu ne peux pas demander d'avis.",go:'agenda',btn:'Voir'});
  const noPhone=iv.filter(i=>(i.statut||'realise')==='planifie'&&i.date&&String(i.date).slice(0,10)>=today&&!((byId[String(i.client_id)]||{}).phone||'').trim()).length;
  if(noPhone) out.push({n:noPhone,t:`rendez-vous à venir sans numéro de téléphone`,why:"Sans numéro, les rappels SMS ne partiront pas. Ajoute le téléphone dans la fiche du client.",go:'crm',btn:'Voir'});
  const stale=(D.clients||[]).filter(c=>c.status==='new'&&c.source==='meta_ads'&&c.created_at&&(now-new Date(c.created_at).getTime())>3*86400000).length;
  if(stale) out.push({n:stale,t:`prospect${stale>1?'s':''} « Nouveau lead » depuis plus de 3 jours`,why:"Appelle-les, ou passe-les en « Non qualifié » s'ils ne sont pas intéressés : tes statistiques seront plus justes.",go:'crm',btn:'Voir'});
  const limit=new Date(now-60*86400000).toISOString().slice(0,10);
  const noAmt=iv.filter(i=>(i.statut||'realise')!=='annule'&&!(Number(i.montant)>0)&&i.date&&String(i.date).slice(0,10)>=limit).length;
  if(noAmt) out.push({n:noAmt,t:`prestation${noAmt>1?'s':''} sans montant`,why:"Sans prix, ton chiffre d'affaires et ton ROAS sont faux. Complète le montant.",go:'prestations_hist',btn:'Voir'});

  return out;
}

// AGENDA SUR TÉLÉPHONE : vue « jour » lisible (bande de la semaine + journée en grand + glisser pour changer de jour)
// ═══════════════════════════════════
const MD_PX=60; // pixels par heure
function isPhone(){ return !!(window.matchMedia&&window.matchMedia('(max-width:768px)').matches); }
function mobileDayAgenda(sel,weekDays,clientArg){
  const today=new Date(), esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const items=[];
  intervOn(sel.d,sel.m,sel.y).filter(i=>i.statut!=='annule').forEach(i=>{ const s=timeToMin(i.heure||'09:00'); items.push({kind:'crm',ref:i,s,e:Math.min(1440,s+(i.duree||60))}); });
  googleOnDay(sel.y,sel.m,sel.d).forEach(g=>{ const s=timeToMin(g.heure); items.push({kind:'g',ref:g,s,e:Math.min(1440,s+g.duree)}); });
  const startH=Math.min(7,items.length?Math.floor(Math.min(...items.map(x=>x.s))/60):7);
  const endH=Math.min(24,Math.max(20,items.length?Math.ceil(Math.max(...items.map(x=>x.e))/60):20));
  const H=(endH-startH)*MD_PX;
  const strip=weekDays.map(dw=>{
    const isToday=dw.d===today.getDate()&&dw.m===today.getMonth()&&dw.y===today.getFullYear();
    const isSel=dw.d===sel.d&&dw.m===sel.m&&dw.y===sel.y;
    const n=intervOn(dw.d,dw.m,dw.y).filter(i=>i.statut!=='annule').length;
    const dn=DAYS[(new Date(dw.y,dw.m,dw.d).getDay()+6)%7];
    return `<button type="button" class="mday-chip${isToday?' today':''}${isSel?' sel':''}" onclick="calDay2(${dw.d},${dw.m},${dw.y})"><small>${dn}</small><b>${dw.d}</b><i class="mday-dot" style="opacity:${n?1:0}"></i></button>`;
  }).join('');
  const prev=addDaysYMD(sel.y,sel.m,sel.d,-1), next=addDaysYMD(sel.y,sel.m,sel.d,1);
  const label=new Date(sel.y,sel.m,sel.d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  let hours=''; for(let h=startH;h<=endH;h++) hours+=`<div class="mday-hour" style="top:${(h-startH)*MD_PX}px"><span>${String(h).padStart(2,'0')}:00</span></div>`;
  const GUT=46;
  const blocks=layoutDayBlocks(items).map(it=>{
    const top=Math.round((it.s/60-startH)*MD_PX), h=Math.max(30,Math.round((it.e-it.s)/60*MD_PX)-2);
    const pos=`top:${top}px;height:${h}px;left:calc(${GUT}px + (100% - ${GUT}px) * ${it.col} / ${it.n});width:calc((100% - ${GUT}px) / ${it.n} - 3px)`;
    const range=minToTime(it.s)+'–'+minToTime(it.e);
    if(it.kind==='g'){ const g=it.ref; return `<div class="mday-ev g" style="${pos}" onclick="event.stopPropagation();convertGoogleEvent('${g.id}')"><b>${esc(g.title||'Événement')}</b><div class="mday-sub">${range} · Google Agenda — touche pour l'ajouter comme RDV client</div></div>`; }
    const o=it.ref, done=o.statut==='realise';
    return `<div class="mday-ev${done?' done':''}" style="${pos}" onclick="event.stopPropagation();editIntervention('${o.id}')"><div style="display:flex;justify-content:space-between;gap:6px"><b>${esc(o.client_name||'—')}</b>${o.montant?`<span class="mday-price">${o.montant} €</span>`:''}</div><div class="mday-sub">${range}${o.prestation?' · '+esc(o.prestation):''}${done?' · ✓':''}</div>${h>=74&&o.adresse?`<div class="mday-sub">📍 ${esc(o.adresse)}</div>`:''}</div>`;
  }).join('');
  const nowLine=(sel.d===today.getDate()&&sel.m===today.getMonth()&&sel.y===today.getFullYear())?(()=>{ const m=today.getHours()*60+today.getMinutes(); return (m/60>=startH&&m/60<=endH)?`<div class="mday-now" style="top:${Math.round((m/60-startH)*MD_PX)}px"></div>`:''; })():'';
  return `<div class="card mday-swipe" style="margin-bottom:1rem">
    <div class="mday-strip">${strip}</div>
    <div class="mday-head"><button type="button" class="mday-nav" onclick="calDay2(${prev.d},${prev.m},${prev.y})" aria-label="Jour précédent">‹</button><div style="text-align:center"><b>${label}</b><div style="font-size:12px;color:var(--text-secondary)">${items.filter(x=>x.kind==='crm').length?items.filter(x=>x.kind==='crm').length+' rendez-vous':'Aucun rendez-vous'}</div></div><button type="button" class="mday-nav" onclick="calDay2(${next.d},${next.m},${next.y})" aria-label="Jour suivant">›</button></div>
    <div class="mday-tl" style="height:${H}px" data-start="${startH}" onclick="mdSlotTap(event,${sel.d},${sel.m},${sel.y},${clientArg})">${hours}${blocks}${nowLine}</div>
    <div style="padding:2px 14px 12px;text-align:center"><button type="button" class="btn sm" onclick="weekToday()">Aujourd'hui</button></div>
  </div>
  <button type="button" class="mday-fab" onclick="openInterventionFor(${clientArg},{d:${sel.d},m:${sel.m},y:${sel.y}})" aria-label="Ajouter un rendez-vous">+</button>`;
}
function mdSlotTap(ev,d,m,y,clientId){
  const tl=ev.currentTarget, r=tl.getBoundingClientRect(), startH=parseInt(tl.dataset.start,10)||7;
  const min=Math.max(0,Math.min(1410,Math.floor(((ev.clientY-r.top)/MD_PX*60+startH*60)/30)*30));
  openInterventionFor(clientId||null,{d,m,y},minToTime(min));
}
// glisser vers la gauche / la droite = jour suivant / précédent
(function(){
  let x0=0,y0=0,on=false;
  document.addEventListener('touchstart',e=>{ const el=e.target.closest&&e.target.closest('.mday-swipe'); on=!!el; if(on){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; } },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!on) return; on=false; const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)>70&&Math.abs(dy)<45){ const n=addDaysYMD(S.cal.sel.y,S.cal.sel.m,S.cal.sel.d,dx<0?1:-1); calDay2(n.d,n.m,n.y); }
  },{passive:true});
})();

function pageTasksAll(){
  const now = new Date().toISOString().slice(0,10);
  const allTasks = (D.tasks||[]).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const pending = allTasks.filter(t=>!t.done);
  const overdue = pending.filter(t=>t.date&&t.date<now);
  const today = pending.filter(t=>t.date===now);
  const upcoming = pending.filter(t=>t.date>now||!t.date);
  const done = allTasks.filter(t=>t.done);

  const renderSection = (title, tasks, color) => tasks.length===0?'':`
    <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:${color};margin:1rem 0 0.5rem">${title} (${tasks.length})</div>
    ${tasks.map(t=>`
      <div style="background:white;border:0.5px solid var(--gray-border);border-radius:var(--radius-md);padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:6px;opacity:${t.done?0.6:1}">
        <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')" style="width:16px;height:16px;cursor:pointer;flex-shrink:0">
        <div style="flex:1;cursor:pointer" onclick="S.crmClientId='${t.client_id}';S.clientDetailTab='taches';nav('crm')">
          <div style="font-size:13px;font-weight:500;text-decoration:${t.done?'line-through':'none'}">${t.titre}</div>
          <div style="font-size:11px;color:var(--text-secondary)">${t.client_name||'—'} ${t.date?'· '+t.date:''}</div>
        </div>
        <span onclick="editTaskModal('${t.id}')" style="cursor:pointer;color:var(--blue);font-size:12px;margin-right:4px">✏️</span>
        <span class="del-btn" onclick="deleteTask('${t.id}')">×</span>
      </div>`).join('')}`;

  return`<div class="topbar"><div class="page-title">Mes tâches</div></div>
  <div class="stats-grid cols3" style="margin-bottom:1rem">
    <div class="stat-card"><div class="stat-label">En retard</div><div class="stat-value" style="color:var(--red-mid)">${overdue.length}</div></div>
    <div class="stat-card"><div class="stat-label">Aujourd'hui</div><div class="stat-value" style="color:var(--amber-dark)">${today.length}</div></div>
    <div class="stat-card"><div class="stat-label">À venir</div><div class="stat-value" style="color:var(--blue)">${upcoming.length}</div></div>
  </div>
  ${pending.length===0&&done.length===0?`<div class="card" style="padding:2rem;text-align:center;color:var(--text-tertiary)">Aucune tâche — crée des rappels depuis les fiches clients !</div>`:''}
  ${renderSection('🔴 En retard',overdue,'var(--red-mid)')}
  ${renderSection('📅 Aujourd hui',today,'var(--amber-dark)')}
  ${renderSection('🔵 À venir',upcoming,'var(--blue)')}
  ${done.length>0?done.slice(0,5).map(t=>`<div style="background:white;border:0.5px solid var(--gray-border);border-radius:var(--radius-md);padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:6px;opacity:0.5"><input type="checkbox" checked onchange="toggleTask('${t.id}')" style="width:16px;height:16px;cursor:pointer;flex-shrink:0"><div style="flex:1"><div style="font-size:13px;text-decoration:line-through">${t.titre}</div><div style="font-size:11px;color:var(--text-secondary)">${t.client_name||'—'}</div></div><span class="del-btn" onclick="deleteTask('${t.id}')">×</span></div>`).join(''):''}`;
}

let _noteTimer=null;function autoSaveNote(clientId,val){clearTimeout(_noteTimer);_noteTimer=setTimeout(()=>saveClientNote(clientId,val),2000);} async function saveClientNote(clientId,val){if(!D.clientNotesDates)D.clientNotesDates={};D.clientNotesDates[clientId]=new Date().toISOString();try{localStorage.setItem('ecolia_notedates_'+currentUser.id,JSON.stringify(D.clientNotesDates));}catch(e){}const ind=document.getElementById('note-save-indicator');if(ind){const t=new Date();ind.textContent='✅ '+t.toLocaleDateString('fr-FR')+' à '+t.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});ind.style.opacity='1';setTimeout(()=>ind.style.opacity='0.4',3000);}   const note=val!==undefined?val:(document.getElementById('client-notes-area')?.value||'');

  if(!D.clientNotes) D.clientNotes = {};
  D.clientNotes[clientId] = note;
  try{ await sb.from('clients').update({notes:note}).eq('id',clientId); }catch(e){ console.error(e); }
  // Show saved feedback
  const btn = document.querySelector('[onclick*="saveClientNote"]');
  if(btn){ const orig=btn.textContent; btn.textContent='✅ Sauvegardé !'; setTimeout(()=>btn.textContent=orig,2000); }
}

function openTaskModal(clientId, clientName){
  S.form = { taskClientId: clientId, taskClientName: clientName, taskTitre:'', taskDate: new Date(Date.now()+86400000).toISOString().slice(0,10) };
  $('modal-content').innerHTML = mTask();
  $('modal-overlay').classList.add('open');
}

function mTask(){
  return`<div class="modal-title">Nouvelle tâche — ${S.form.taskClientName}</div>
  <div class="field"><label>Tâche *</label>
    <input value="${S.form.taskTitre||''}" oninput="S.form.taskTitre=this.value" placeholder="ex: Rappeler demain matin, Envoyer devis, Relancer par SMS..." style="width:100%;padding:8px;border:0.5px solid var(--gray-border-mid);border-radius:var(--radius-md);font-size:13px;box-sizing:border-box">
  </div>
  <div class="field"><label>Date d'échéance</label>
    <input type="date" value="${S.form.taskDate||''}" oninput="S.form.taskDate=this.value">
  </div>
  <div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">Annuler</button><button class="btn-save" onclick="saveTask()">Ajouter</button></div>`;
}

async function saveTask(){
  if(!S.form.taskTitre?.trim()){ alert('Titre requis.'); return; }
  // saved to Supabase
  const row={user_id:currentUser.id,client_id:S.form.taskClientId||'',client_name:S.form.taskClientName||'',titre:S.form.taskTitre.trim(),date:S.form.taskDate||'',done:false};
  const{data,error}=await sb.from('tasks').insert(row).select().single();
  if(error){alert('Erreur: '+error.message);return;}
  if(!D.tasks)D.tasks=[];
  if(data)D.tasks.push(data);
  closeModal();
  renderPage();
}

async function toggleTask(id){
  const t = (D.tasks||[]).find(x=>x.id===id||x.id==id);
  if(!t) return; t.done=!t.done; await sb.from('tasks').update({done:t.done}).eq('id',id);
  renderPage();
}

async function deleteTask(id){
  await sb.from('tasks').delete().eq('id',id);
  D.tasks=(D.tasks||[]).filter(x=>x.id!==id&&x.id!=id);
  renderPage();
}

function editTaskModal(id){
  const t=(D.tasks||[]).find(x=>x.id===id||x.id==id);
  if(!t) return;
  S.form={taskEditId:id,taskClientId:t.client_id,taskClientName:t.client_name,taskTitre:t.titre,taskDate:t.date||''};
  $('modal-content').innerHTML=mTaskEdit();
  $('modal-overlay').classList.add('open');
}

function mTaskEdit(){
  return`<div class="modal-title">Modifier la tâche</div>
  <div class="field"><label>Tâche *</label>
    <input value="${S.form.taskTitre||''}" oninput="S.form.taskTitre=this.value" style="width:100%;padding:8px;border:0.5px solid var(--gray-border-mid);border-radius:var(--radius-md);font-size:13px;box-sizing:border-box">

  <div class="field"><label>Date d'échéance</label>

}

async function saveTaskEdit(){
  if(!S.form.taskTitre?.trim()){alert('Titre requis.');return;}
  const t=(D.tasks||[]).find(x=>x.id===S.form.taskEditId||x.id==S.form.taskEditId);

async function loadTasks(){
  try{
    const{data}=await sb.from('tasks').select('*').eq('user_id',currentUser.id);

async function updateLeadStatut(clientId, newStatut){
  const{error} = await sb.from('clients').update({status:newStatut}).eq('id',clientId);
  if(error){alert('Erreur: '+error.message);return;}
  const c = D.clients.find(x=>x.id===clientId||x.id==clientId);
  if(c) c.status = newStatut;
  // Update count badges without full re-render
  const counts = {};
  STATUTS.forEach(s=>{ counts[s.v]=D.clients.filter(c=>(c.status||'new')===s.v).length; });
  renderPage();
}


function editClient(id){
  const c = D.clients.find(x=>x.id===id||x.id==id);
  if(!c) return;
  S.form = {
    editId: c.id,
    name: c.name, phone: c.phone||'',

    email: c.email||'', adresse_postale: c.adresse_postale||'',
    type_client: c.type_client||'particulier',
    notes: c.notes||'',
    ca: c.ca||0,
    sms_optout: !!c.sms_optout, _optout0: !!c.sms_optout,
    source: c.source||'autre',
    campagne: c.campagne||'', ensemble: c.ensemble||'', creation: c.creation||''
  };
  $('modal-content').innerHTML = mClient();
  $('modal-overlay').classList.add('open');
}

function pagePrestationsHist(){
  const now = new Date();
  const view = S.prestView || 'semaine';
  // Semaine courante : lundi au dimanche
  const dayOfWeek = now.getDay()===0?6:now.getDay()-1; // 0=lundi
  const weekStart = new Date(now.getFullYear(),now.getMonth(),now.getDate()-dayOfWeek);
  const weekEnd = new Date(weekStart.getTime()+7*24*60*60*1000);
  const monthPrefix = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');

  let items = D.interventions.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(view==='semaine') items = items.filter(i=>{
    if(!i.date) return false;
    const d = new Date(i.date);
    return d>=weekStart && d<weekEnd;
  });
  else if(view==='mois') items = items.filter(i=>i.date&&i.date.startsWith(monthPrefix));

  // Filtre statut paiement
  const prestStatut = S.prestStatut||'tous';
  if(prestStatut==='paye') items = items.filter(i=>i.statut_paiement==='paye');
  else if(prestStatut==='attente') items = items.filter(i=>i.statut_paiement!=='paye');

  // CA en attente
  const caAttente = items.filter(i=>i.statut_paiement!=='paye').reduce((s,i)=>s+(i.montant||0),0);
  const caPaye = items.filter(i=>i.statut_paiement==='paye').reduce((s,i)=>s+(i.montant||0),0);

  const caView = items.reduce((s,i)=>s+(i.montant||0),0);
  const tabStyle = v=>`padding:8px 16px;font-size:13px;cursor:pointer;font-weight:500;border-bottom:2px solid ${view===v?'var(--blue)':'transparent'};color:${view===v?'var(--blue)':'var(--text-secondary)'};margin-bottom:-1px`;

  return`<div class="topbar">
    <div class="page-title">Mes rendez-vous</div>
    <button class="btn primary" onclick="openModal('intervention')">+ Ajouter une prestation</button>
  </div>
  ${coachHint('prestations',"Tu n'as pas besoin de saisir ici tes rendez-vous : ajoute-les dans l'<strong>agenda</strong>, ils arrivent automatiquement dans cette liste avec leur montant. Vérifie seulement le <strong>paiement</strong> (✅ Payé / ⏳ En attente).")}

  <div style="display:flex;border-bottom:0.5px solid var(--gray-border);margin-bottom:1rem;overflow-x:auto">
    <div style="${tabStyle('semaine')}" onclick="S.prestView='semaine';renderPage()">Cette semaine</div>
    <div style="${tabStyle('mois')}" onclick="S.prestView='mois';renderPage()">Ce mois</div>
    <div style="${tabStyle('historique')}" onclick="S.prestView='historique';renderPage()">Semaines</div>
    <div style="${tabStyle('historique_mois')}" onclick="S.prestView='historique_mois';renderPage()">Mois</div>
    <div style="${tabStyle('tout')}" onclick="S.prestView='tout';renderPage()">Tout</div>
  </div>

  ${view==='historique' ? renderWeeklyHistory() : ''}
  ${view==='historique_mois' ? renderMonthlyHistory() : ''}

  ${(view!=='historique'&&view!=='historique_mois') ? `<div class="stats-grid cols4" style="margin-bottom:1rem">
    <div class="stat-card"><div class="stat-label">Prestations</div><div class="stat-value">${items.length}</div></div>
    <div class="stat-card"><div class="stat-label">CA total</div><div class="stat-value">${caView.toFixed(0)}€</div></div>
    <div class="stat-card"><div class="stat-label">✅ Encaissé</div><div class="stat-value" style="color:var(--green-dark)">${caPaye.toFixed(0)}€</div></div>
    <div class="stat-card"><div class="stat-label">⏳ En attente</div><div class="stat-value" style="color:var(--amber-dark)">${caAttente.toFixed(0)}€</div></div>
  </div>` : ''}

  ${(view!=='historique'&&view!=='historique_mois') ? `<!-- Filtre statut paiement -->
  <div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap">
    <span onclick="S.prestStatut='tous';renderPage()" style="cursor:pointer;padding:5px 12px;border-radius:100px;font-size:12px;font-weight:500;border:0.5px solid var(--gray-border-mid);background:${(S.prestStatut||'tous')==='tous'?'var(--blue)':'var(--bg-primary)'};color:${(S.prestStatut||'tous')==='tous'?'white':'var(--text-secondary)'}">Tous</span>
    <span onclick="S.prestStatut='attente';renderPage()" style="cursor:pointer;padding:5px 12px;border-radius:100px;font-size:12px;font-weight:500;border:0.5px solid var(--gray-border-mid);background:${S.prestStatut==='attente'?'var(--amber-dark)':'var(--bg-primary)'};color:${S.prestStatut==='attente'?'white':'var(--text-secondary)'}">⏳ En attente</span>
    <span onclick="S.prestStatut='paye';renderPage()" style="cursor:pointer;padding:5px 12px;border-radius:100px;font-size:12px;font-weight:500;border:0.5px solid var(--gray-border-mid);background:${S.prestStatut==='paye'?'var(--green-mid)':'var(--bg-primary)'};color:${S.prestStatut==='paye'?'white':'var(--text-secondary)'}">✅ Payé</span>
  </div>` : ''}

  ${(view!=='historique'&&view!=='historique_mois') ? `<div class="card">
    <div class="tbl-wrap"><table>
      <thead><tr><th>Date</th><th>Client</th><th>Véhicule</th><th>Prestation</th><th>Règlement</th><th class="td-right">Montant</th><th>Statut</th><th></th></tr></thead>
      <tbody>
      ${items.length===0?`<tr><td colspan="7" class="empty">Aucune prestation — ajoute ta première !</td></tr>`:
        items.map(i=>`<tr>
          <td style="color:var(--text-secondary)">${i.date||'—'}</td>
          <td><strong>${i.client_name||'—'}</strong></td>
          <td>${i.vehicle||'—'}</td>
          <td>${i.prestation||'—'}</td>
          <td><span class="pill pill-blue">${i.moyen_paiement||'—'}</span></td>
          <td class="td-right"><strong style="color:var(--blue)">${(i.montant||0).toFixed(0)}€</strong></td>
          <td>
            ${i.statut_paiement==='paye'
              ? `<span onclick="togglePaiement('${i.id}','attente')" style="cursor:pointer;background:var(--green-light);color:var(--green-dark);padding:3px 8px;border-radius:100px;font-size:11px;font-weight:600">✅ Payé</span>`
              : `<span onclick="togglePaiement('${i.id}','paye')" style="cursor:pointer;background:var(--amber-light);color:var(--amber-dark);padding:3px 8px;border-radius:100px;font-size:11px;font-weight:600">⏳ En attente</span>`
            }
          </td>
          <td style="display:flex;gap:8px;align-items:center">
            ${smxReviewBtn(i)}
            <span style="cursor:pointer;color:var(--blue);font-size:12px" onclick="editIntervention('${i.id}')">✏️</span>
            <span class="del-btn" onclick="delIntervention('${i.id}')">×</span>
          </td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  </div>` : ''}`;
}

async function saveIntervention(){
  const montant = parseFloat(S.form.montant)||0;
  if(!montant){ alert('Montant requis.'); return; }
  const heure = S.form.heure||'09:00';

  // EDIT mode
  if(S.form.editIntervId){
    const old = D.interventions.find(i=>i.id===S.form.editIntervId||i.id==S.form.editIntervId);
    if(!old) return;
    const prevMontant = old.montant||0;
    const wasRealise = (old.statut||'realise')==='realise';
    const newStatut = S.form.statut||old.statut||'realise';
    const nowRealise = newStatut==='realise';
    const newClientName = (S.form._clientName||'').trim() || old.client_name;
    const updates = {
      date: S.form.date||old.date,
      heure,
      duree: parseInt(S.form.duree)||old.duree||60,
      electricite: S.form.electricite||old.electricite||'oui',
      vehicle: S.form.vehicle||'',
      adresse: S.form.adresse||'',
      infos_complementaires: S.form.infos_complementaires||'',
      options: S.form.selectedOptions||[],
      prestation: S.form.prestation==='Autre'?(S.form.prestationLibre||'Autre'):S.form.prestation||old.prestation,
      montant,
      moyen_paiement: S.form.moyen_paiement,
      statut: newStatut,
      client_name: newClientName
    };
    const{error}=await sb.from('interventions').update(updates).eq('id',S.form.editIntervId);
    if(error){alert('Erreur: '+error.message);return;}
    // Si le nom a été corrigé ici, on renomme aussi la fiche client elle-même
    if(newClientName!==old.client_name && old.client_id){
      const{error:e2}=await sb.from('clients').update({name:newClientName}).eq('id',old.client_id);
      if(!e2){
        const c = D.clients.find(x=>x.id===old.client_id||x.id==old.client_id);
        if(c) c.name = newClientName;
      }
    }
    Object.assign(old, updates);
    if(newStatut==='planifie') autoExportToGoogle(old); // pas de await : ne bloque pas la fermeture
    // Le CA ne reflète que les prestations "réalisées" — on n'ajuste que la variation liée à ce statut
    let diff = 0;
    if(wasRealise && nowRealise) diff = montant - prevMontant;
    else if(!wasRealise && nowRealise) diff = montant;
    else if(wasRealise && !nowRealise) diff = -prevMontant;
    if(diff!==0){
      const c = D.clients.find(x=>x.id===old.client_id||x.id==old.client_id);
      if(c){
        const newCA = Math.max(0,(c.ca||0)+diff);
        await sb.from('clients').update({ca:newCA}).eq('id',c.id);
        c.ca = newCA;
      }
    }
    S.selectedInterv=null; S.selectedIntervPos=null;
    closeModal();render();
    return;
  }

  let clientId = S.form.clientId;
  let clientName = '';

  if(S.form.newClient || S.form.clientId==='nouveau'){
    if(!S.form.newClientName?.trim()){ alert('Nom du client requis.'); return; }
    // Create new client
    const{data,error}=await sb.from('clients').insert({
      user_id:currentUser.id,
      name:S.form.newClientName.trim(),
      phone:S.form.newClientPhone||null,
      ca:0, status:'new', type_client:'particulier', source:'autre'
    }).select().single();
    if(error){alert('Erreur création client: '+error.message);return;}
    if(data){ D.clients.push(data); clientId=data.id; clientName=data.name; }
  } else {
    const c = D.clients.find(x=>x.id==clientId||x.id===clientId);
    clientName = c?.name||'';
  }

  if(!clientId){ alert('Sélectionne un client.'); return; }

  const statut = S.form.statut || S.form.defaultStatut || 'realise';
  const prestation = S.form.prestation==='Autre'?(S.form.prestationLibre||'Autre'):S.form.prestation||'';
  const row={
    user_id:currentUser.id,
    client_id:clientId,
    client_name:clientName,
    date:S.form.date||new Date().toISOString().slice(0,10),
    heure,
    duree:parseInt(S.form.duree)||60,
    electricite:S.form.electricite||'oui',
    vehicle:S.form.vehicle||'',
    adresse:S.form.adresse||'',
    infos_complementaires:S.form.infos_complementaires||'',
    options:S.form.selectedOptions||[],
    prestation,
    montant,
    moyen_paiement:S.form.moyen_paiement,
    statut
  };
  const{data,error}=await sb.from('interventions').insert(row).select().single();
  if(error){alert('Erreur: '+error.message);return;}
  if(data){
    D.interventions.push(data);
    if(statut==='planifie') autoExportToGoogle(data); // pas de await : ne bloque pas la fermeture du modal
  }

  const c = D.clients.find(x=>x.id==clientId||x.id===clientId);
  // La fiche du client récupère l'adresse saisie ici si elle n'en avait pas encore (gain de temps pour la prochaine prestation)
  if(c && !(c.adresse_postale||'').trim() && (S.form.adresse||'').trim()){
    const{error:adrErr}=await sb.from('clients').update({adresse_postale:S.form.adresse.trim()}).eq('id',clientId);
    if(!adrErr) c.adresse_postale=S.form.adresse.trim();
  }
  // Le CA n'est crédité que si la prestation est déjà réalisée (pas pour un RDV futur juste planifié)
  if(c && statut==='realise'){
    const newCA = (c.ca||0)+montant;
    await sb.from('clients').update({ca:newCA}).eq('id',clientId);
    c.ca = newCA;
  }
  // Toute prise de RDV (même future) fait passer le prospect en "Client"
  if(c && c.status!=='client'){
    await sb.from('clients').update({status:'client'}).eq('id',clientId);
    c.status = 'client';
  }
  S.bookingForClient = null; // fin du flux de réservation guidée depuis la fiche client
  S.selectedInterv = null; S.selectedIntervPos = null;

  closeModal();render();
}

async function markIntervRealise(id){
  const i = D.interventions.find(x=>x.id===id||x.id==id);
  if(!i || i.statut==='realise') return;
  const{error}=await sb.from('interventions').update({statut:'realise'}).eq('id',id);
  if(error){alert('Erreur: '+error.message);return;}
  i.statut='realise';
  const c = D.clients.find(x=>x.id===i.client_id||x.id==i.client_id);
  if(c){
    const newCA=(c.ca||0)+(i.montant||0);
    await sb.from('clients').update({ca:newCA}).eq('id',c.id);
    c.ca=newCA;
  }
  render();
}

function editIntervention(id){
  const i = D.interventions.find(x=>x.id===id||x.id==id);
  if(!i) return;
  S.form = {
    editIntervId: id,
    clientId: i.client_id,
    newClient: false,
    date: i.date||'',
    heure: i.heure||'09:00',
    duree: i.duree||60,
    electricite: i.electricite||'oui',
    statut: i.statut||'realise',
    vehicle: i.vehicle||'',
    adresse: i.adresse||'',
    infos_complementaires: i.infos_complementaires||'',
    selectedOptions: i.options||[],
    prestation: i.prestation||'',
    montant: i.montant||0,
    moyen_paiement: i.moyen_paiement||''
  };
  // Set client name for display
  S.form._clientName = i.client_name;
  $('modal-content').innerHTML = mIntervention();
  $('modal-overlay').classList.add('open');
}

function renderMonthlyHistory(){
  const now = new Date();
  // Build months: 12 past + current + 6 future
  const months = [];
  for(let i=11; i>=-6; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const y=d.getFullYear(), m=d.getMonth();
    const prefix = y+'-'+String(m+1).padStart(2,'0');
    const items = D.interventions.filter(i=>i.date&&i.date.startsWith(prefix))
      .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const label = d.toLocaleString('fr-FR',{month:'long',year:'numeric'});
    const ca = items.reduce((s,i)=>s+(i.montant||0),0);
    const paye = items.filter(i=>i.statut_paiement==='paye').reduce((s,i)=>s+(i.montant||0),0);
    const attente = ca - paye;
    const isCurrent = y===now.getFullYear()&&m===now.getMonth();
    const isFuture = d > now;
    months.push({y,m,label,items,ca,paye,attente,isCurrent,isFuture,prefix});
  }

  // Select month
  const selKey = S.histMoisKey || months.find(m=>m.isCurrent)?.prefix || months[11]?.prefix;
  const selMonth = months.find(m=>m.prefix===selKey) || months[11];

  return`<div style="display:grid;grid-template-columns:220px 1fr;gap:1rem;align-items:start">
    <!-- Liste des mois -->
    <div class="card" style="overflow:hidden">
      ${months.map(mo=>`<div onclick="S.histMoisKey='${mo.prefix}';renderPage()" style="padding:10px 14px;cursor:pointer;border-bottom:0.5px solid var(--gray-border);background:${selKey===mo.prefix?'var(--blue-light)':mo.isCurrent?'var(--bg-secondary)':'transparent'};color:${selKey===mo.prefix?'var(--blue)':mo.isFuture?'var(--text-tertiary)':'var(--text-primary)'}">
        <div style="font-size:13px;font-weight:${mo.isCurrent?'600':'400'}">${mo.label}${mo.isCurrent?' ●':''}</div>
        <div style="font-size:11px;color:${selKey===mo.prefix?'var(--blue)':'var(--text-secondary)'};margin-top:2px">${mo.ca>0?mo.ca.toFixed(0)+'€':mo.isFuture?'à venir':'—'} · ${mo.items.length} presta${mo.items.length>1?'tions':'tion'}</div>
      </div>`).join('')}
    </div>

    <!-- Détail du mois sélectionné -->
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <div style="font-size:16px;font-weight:600">${selMonth?.label||''}</div>
        <div style="display:flex;gap:12px;font-size:13px">
          <span style="color:var(--blue);font-weight:600">${selMonth?.ca.toFixed(0)||0}€</span>
          <span style="color:var(--green-dark)">✅ ${selMonth?.paye.toFixed(0)||0}€</span>
          <span style="color:var(--amber-dark)">⏳ ${selMonth?.attente.toFixed(0)||0}€</span>
        </div>
      </div>
      ${!selMonth||selMonth.items.length===0
        ? `<div class="card" style="padding:2rem;text-align:center;color:var(--text-tertiary)">Aucune prestation ce mois</div>`
        : `<div class="card">
            <table><thead><tr><th>Date</th><th>Client</th><th>Véhicule</th><th>Prestation</th><th>Règlement</th><th class="td-right">Montant</th><th>Statut</th></tr></thead>
            <tbody>
              ${selMonth.items.map(i=>`<tr>
                <td style="color:var(--text-secondary)">${i.date}</td>
                <td><strong>${i.client_name||'—'}</strong></td>
                <td>${i.vehicle||'—'}</td>
                <td>${i.prestation||'—'}</td>
                <td style="color:var(--text-secondary)">${i.moyen_paiement||'—'}</td>
                <td class="td-right"><strong style="color:var(--blue)">${(i.montant||0).toFixed(0)}€</strong></td>
                <td>
                  ${i.statut_paiement==='paye'
                    ? `<span onclick="togglePaiement('${i.id}','attente')" style="cursor:pointer;background:var(--green-light);color:var(--green-dark);padding:3px 8px;border-radius:100px;font-size:11px;font-weight:600">✅ Payé</span>`
                    : `<span onclick="togglePaiement('${i.id}','paye')" style="cursor:pointer;background:var(--amber-light);color:var(--amber-dark);padding:3px 8px;border-radius:100px;font-size:11px;font-weight:600">⏳ En attente</span>`
                  }
                </td>
              </tr>`).join('')}
            </tbody></table>
          </div>`
      }
    </div>
  </div>`;
}

function renderWeeklyHistory(){
  // Group interventions by week
  const weeks = {};
  D.interventions.forEach(i=>{
    if(!i.date) return;
    const d = new Date(i.date);
    const day = d.getDay()===0?6:d.getDay()-1;
    const weekStart = new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);
    const key = weekStart.toISOString().slice(0,10);
    if(!weeks[key]) weeks[key]={start:weekStart,items:[]};
    weeks[key].items.push(i);
  });
  const sortedWeeks = Object.keys(weeks).sort((a,b)=>b.localeCompare(a));
  if(sortedWeeks.length===0) return '<div style="padding:2rem;text-align:center;color:var(--text-tertiary)">Aucune prestation enregistrée</div>';

  return sortedWeeks.map(key=>{
    const w = weeks[key];
    const weekEnd = new Date(w.start.getTime()+6*24*60*60*1000);
    const label = w.start.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' – '+weekEnd.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
    const ca = w.items.reduce((s,i)=>s+(i.montant||0),0);
    const paye = w.items.filter(i=>i.statut_paiement==='paye').reduce((s,i)=>s+(i.montant||0),0);
    const attente = ca - paye;
    const now = new Date();
    const thisWeekStart = new Date(now.getFullYear(),now.getMonth(),now.getDate()-(now.getDay()===0?6:now.getDay()-1));

async function togglePaiement(id, newStatut){
  const i = D.interventions.find(x=>x.id===id||x.id==id);
  if(!i) return;
  const{error}=await sb.from('interventions').update({statut_paiement:newStatut}).eq('id',id);
  if(error){alert('Erreur: '+error.message);return;}
  i.statut_paiement = newStatut;
  render();
}

async function delIntervention(id){
  if(!confirm('Supprimer cette prestation ?')) return;
  const interv = D.interventions.find(i=>i.id===id||i.id==id);
  if(!interv) return;
  await deleteGoogleEventFor(interv);
  const{error}=await sb.from('interventions').delete().eq('id',id);
  if(error){ alert('Erreur: '+error.message); return; }
  // Ne retire du CA que si ce RDV avait effectivement été compté (statut "réalisé")
  if((interv.statut||'realise')==='realise'){
    const c = D.clients.find(x=>x.id===interv.client_id||x.id==interv.client_id||x.name===interv.client_name);
    if(c){
      const newCA = Math.max(0,(c.ca||0)-(interv.montant||0));
      await sb.from('clients').update({ca:newCA}).eq('id',c.id);
      c.ca = newCA;
    }
  }
  D.interventions = D.interventions.filter(i=>i.id!==id&&i.id!=id);
  if(S.selectedInterv===id){ S.selectedInterv=null; S.selectedIntervPos=null; }
  render();
}

function getClientsForMonth(year, month){
  // Clients ayant eu une intervention ce mois
  const prefix = year+'-'+String(month+1).padStart(2,'0');
  const names = new Set(D.interventions.filter(i=>i.date&&i.date.startsWith(prefix)).map(i=>i.client_name));
  return D.clients.filter(c=>names.has(c.name));
}
function getDepensesForMonth(year, month){
  const prefix = year+'-'+String(month+1).padStart(2,'0');
  const manuelle = D.depenses.filter(d=>d.date&&d.date.startsWith(prefix));
  return manuelle;
}

function getTauxForMonth(y, m){
  if(!S.tauxParMois) S.tauxParMois = {};
  const key = `${y}-${m}`;
  return S.tauxParMois[key] != null ? S.tauxParMois[key] : (S.tauxURSSAF!=null ? S.tauxURSSAF : 22);
}
function setTauxForMonth(y, m, val){
  if(!S.tauxParMois) S.tauxParMois = {};
  S.tauxParMois[`${y}-${m}`] = val;
}

  }).join('');
  return`${sumH}<div class="card"><div class="card-head"><span class="card-title">Suivi hebdomadaire</span><span style="font-size:11px;color:var(--text-secondary)">Métriques calculées automatiquement</span></div>

  <tbody>${rows.length===0?`<tr><td colspan="19" class="empty">Ajoute ta première semaine</td></tr>`:tbody}</tbody></table></div></div>`;

async function smxSendSenderReq(){
  const f=smxSenderForm(); const sender=smxCleanSender(f.sender).toUpperCase();

  if(!(f.commercial_name||'').trim()||!(f.legal_name||'').trim()){ alert('Indique le nom commercial de ton entreprise et ton nom.'); return; }
  if(siret.length!==14){ alert('Le SIRET doit contenir 14 chiffres.'); return; }
  if(!(f.page_url||'').trim()){ alert('Indique le lien de ta page Facebook, Instagram ou de ton site.'); return; }
  if(!f.auth_ok){ alert('Coche la case d\'autorisation pour que Thomas puisse faire la demande.'); return; }

  const row={user_id:currentUser.id,sender,commercial_name:f.commercial_name.trim(),legal_name:f.legal_name.trim(),siret,page_url:f.page_url.trim(),link_domains:smxAutoDomains()||null,monthly_volume:200,example_message:smxAutoExample()||null,authorization_by:f.legal_name.trim(),authorization_at:(prev&&prev.authorization_at)||new Date().toISOString(),status:'demande',updated_at:new Date().toISOString()};

  renderPage();
}

const SC_DEFAULT="Bonjour {prenom}, cela fait un moment ! {entreprise} vous offre -10% sur votre prochain nettoyage avec le code {code_promo}. Réservez : {lien_rdv}";
function scState(){ if(!S.sc) S.sc={who:'clients',since:'0',city:'',body:SC_DEFAULT,name:''}; return S.sc; }
function scSet(f,v){ scState()[f]=v; if(f!=='body'&&f!=='name'&&f!=='city') renderPage(); else if(f==='city'){ scRefreshLive(); } else scRefreshLive(); }
function scLastRdv(c){ let last=null; (D.interventions||[]).forEach(i=>{ if(String(i.client_id)===String(c.id)&&(i.statut||'realise')!=='annule'&&i.date){ const d=String(i.date).slice(0,10); if(!last||d>last) last=d; } }); return last; }
function scAudience(){
  const st=scState(), today=kpiParis(Date.now());
  const cut=(st.since!=='0'&&st.since!=='never')?(()=>{ const d=new Date(today+'T12:00:00'); d.setMonth(d.getMonth()-parseInt(st.since,10)); return d.toISOString().slice(0,10); })():null;
  const city=(st.city||'').trim().toLowerCase();
  const all=D.clients||[]; let noPhone=0, optout=0; const list=[];
  all.forEach(c=>{
    if(st.who==='clients'&&c.status!=='client') return;
    if(st.who==='prospects'&&(c.status==='client'||c.status==='non_qualifie')) return;
    if(st.who==='tous'&&c.status==='non_qualifie') return;
    if(city&&!(`${c.ville||''} ${c.adresse_postale||''}`.toLowerCase().includes(city))) return;
    const last=scLastRdv(c);
    if(cut&&last&&last>cut) return;                 // il est venu plus récemment que la période choisie
    if(st.since==='never'&&last) return;            // « jamais venus » : aucun rendez-vous enregistré
    if(String(c.phone||'').replace(/\D/g,'').length<9){ noPhone++; return; }
    if(c.sms_optout){ optout++; return; }
    list.push(c);
  });
  return {list,noPhone,optout};
}
function scMessageInfo(){
  const s=(S.sms&&S.sms.settings)||{}, st=scState();
  const v={prenom:'Marie',nom:'Marie Dupont',entreprise:s.entreprise||'Mon entreprise',lien_rdv:s.booking_url||'https://…',lien_avis:s.review_url||'https://…',code_promo:s.promo_code||'CODE10'};
  let txt=smxGsm(st.body.replace(/\{(\w+)\}/g,(m,x)=>v[x]??'')).replace(/\s+/g,' ').trim();
  const suffix=String((S.sms&&S.sms.cfg&&S.sms.cfg.sms_campaign_suffix)||'').trim();
  if(suffix) txt=(txt+' '+suffix).trim();
  const need=[]; if(st.body.includes('{lien_rdv}')&&!(s.booking_url||'').trim()) need.push('ton lien de rendez-vous'); if(st.body.includes('{lien_avis}')&&!(s.review_url||'').trim()) need.push('ton lien d\'avis'); if(st.body.includes('{code_promo}')&&!(s.promo_code||'').trim()) need.push('ton code promo');
  return {txt,seg:smxSegments(txt),len:[...txt].length,need,suffix};
}

async function scSend(){
  const st=scState(), a=scAudience(), m=scMessageInfo();
  if(!a.list.length) return;
  if(m.need.length){ alert('Ton message utilise '+m.need.join(' et ')+' : renseigne-le d\'abord dans « SMS automatiques › Mes informations ».'); return; }
  const approved=!!(S.sms.senderReq&&S.sms.senderReq.status==='approuve'), testMode=!!(S.sms.settings&&S.sms.settings.test_mode);
  if(!confirm(`Envoyer ce SMS à ${a.list.length} client${a.list.length>1?'s':''} ?\n\n« ${m.txt} »\n\nCoût : ${a.list.length*m.seg} SMS. Les envois se font entre 8h et 20h (jamais le dimanche).${approved?'':'\n\n⚠ Ton nom d\'expéditeur n\'est pas encore approuvé : les SMS ne partiront pas tant qu\'il ne l\'est pas.'}`)) return;
  const btn=document.getElementById('sc-btn'); if(btn){ btn.disabled=true; btn.textContent='Envoi en cours…'; }
  const name=(st.name||'').trim()||('Campagne du '+new Date().toLocaleDateString('fr-FR'));
  const{data,error}=await sb.rpc('sms_create_campaign',{p_name:name,p_body:st.body,p_clients:a.list.map(c=>String(c.id)),p_segments:m.seg});

  const msg={sms_inactif:"Les SMS ne sont pas activés sur ton compte.",texte_vide:"Écris ton message.",aucun_destinataire:"Aucun client à contacter (déjà sollicités ces 30 derniers jours, sans numéro, ou désinscrits).",trop_de_destinataires:"Trop de destinataires (1 000 maximum par campagne).",solde_insuffisant:`Solde insuffisant : il faut ${data&&data.need} SMS et tu en as ${data&&data.remaining}. Rachète des SMS ou réduis la liste.`,non_connecte:"Reconnecte-toi."};
  if(!data||!data.ok){ alert(msg[data&&data.reason]||"La campagne n'a pas pu être lancée."); scRefreshLive(); return; }
  S.sc=null; await loadSms(); alert(`C'est lancé ! ${data.count} SMS vont partir dans les prochaines minutes (entre 8h et 20h).`+(data.excluded>0?`\n${data.excluded} client(s) ont été écartés (déjà contactés récemment, sans numéro ou désinscrits).`:'')); renderPage();
}

const BK_DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
function bkSlugify(t){ return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40); }
function bkLink(slug){ return location.origin+location.pathname.replace(/[^/]*$/,'')+'reserver.html?c='+encodeURIComponent(slug||''); }
function bkState(){
  if(S.bk) return S.bk;
  const b=D.booking;
  const sms=(S.sms&&S.sms.settings)||{};
  const base=(D.profil&&D.profil.nom_entreprise)||sms.entreprise||'';
  const defWin={}; for(let d=1;d<=6;d++) defWin[d]=[['09:00','12:00'],['14:00','17:00']];
  S.bk=b?{slug:b.slug,enabled:!!b.enabled,title:b.title||'',zone:b.zone||'',message:b.message||'',windows:JSON.parse(JSON.stringify(b.windows||{})),capacity:b.capacity||1,min_notice_hours:b.min_notice_hours||12,max_days_ahead:b.max_days_ahead||30,days_off:(b.days_off||[]).slice(),isNew:false}
        :{slug:bkSlugify(base),enabled:true,title:base,zone:'',message:'',windows:defWin,capacity:1,min_notice_hours:12,max_days_ahead:30,days_off:[],isNew:true};
  return S.bk;
}
function bkSet(f,v){ const b=bkState(); b[f]=(f==='capacity'||f==='min_notice_hours'||f==='max_days_ahead')?parseInt(v,10):(f==='slug'?bkSlugify(v):v); if(f==='enabled'||f==='slug') renderPage(); }
function bkAddWin(d){ const w=bkState().windows; (w[d]=w[d]||[]).push(['09:00','12:00']); renderPage(); }
function bkDelWin(d,i){ const w=bkState().windows; (w[d]||[]).splice(i,1); if(!w[d].length) delete w[d]; renderPage(); }
function bkSetWin(d,i,k,v){ bkState().windows[d][i][k]=v; }
function bkAddOff(){ const el=document.getElementById('bk-off'); const v=el&&el.value; if(!v) return; const o=bkState().days_off; if(!o.includes(v)) o.push(v); o.sort(); renderPage(); }
function bkDelOff(v){ const b=bkState(); b.days_off=b.days_off.filter(x=>x!==v); renderPage(); }
async function bkSave(){
  const b=bkState();
  if(!/^[a-z0-9][a-z0-9-]{2,39}$/.test(b.slug||'')){ alert("L'adresse de ta page doit faire 3 à 40 caractères (lettres minuscules, chiffres, tirets)."); return; }
  const wins=b.windows, clean={};
  for(const d of Object.keys(wins)){
    const rows=(wins[d]||[]).filter(x=>x[0]&&x[1]);
    for(const r of rows){ if(r[1]<=r[0]){ alert('Un créneau finit avant de commencer ('+BK_DAYS[d-1]+') : corrige les heures.'); return; } }
    if(rows.length) clean[d]=rows;
  }
  if(b.enabled&&!Object.keys(clean).length){ alert("Ajoute au moins un créneau pour activer ta page de réservation."); return; }
  const{data:free,error:e0}=await sb.rpc('booking_slug_free',{p_slug:b.slug});
  if(e0){ alert('Erreur : '+e0.message); return; }
  if(free===false){ alert("Cette adresse est déjà prise par quelqu'un d'autre : choisis-en une autre."); return; }
  const row={user_id:currentUser.id,slug:b.slug,enabled:!!b.enabled,title:(b.title||'').trim()||null,zone:(b.zone||'').trim()||null,message:(b.message||'').trim()||null,windows:clean,capacity:Math.max(1,b.capacity||1),min_notice_hours:Math.max(0,b.min_notice_hours||0),max_days_ahead:Math.min(90,Math.max(1,b.max_days_ahead||30)),days_off:b.days_off||[],updated_at:new Date().toISOString()};
  const{error}=await sb.from('booking_settings').upsert(row,{onConflict:'user_id'});
  if(error){ alert('Erreur : '+error.message); return; }
  D.booking=row; S.bk=null; S.bkSaved=true; renderPage();
}
function bkCopy(){ const l=bkLink((D.booking&&D.booking.slug)||bkState().slug); if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(l).then(()=>alert('Lien copié !')).catch(()=>prompt('Copie ce lien :',l)); else prompt('Copie ce lien :',l); }

    <div style="font-size:12.5px;color:var(--text-secondary);line-height:1.5;margin-top:4px">Un créneau est complet quand il contient déjà autant de rendez-vous que ce que tu autorises. Les rendez-vous de ton agenda CRM sont pris en compte. <strong>Les événements de ton Google Agenda qui ne sont pas des « RDV - … » ne bloquent pas encore les créneaux</strong> : ferme les jours concernés avec « Jours de congé ».</div></div></div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:2rem"><button class="btn primary" onclick="bkSave()">Enregistrer</button></div>`;
}
// ═══════════════════════════════════
// KPI FACEBOOK AUTOMATIQUES (prospects, clients, récap par publicité) — seul chiffre saisi : les dépenses de la semaine
// ═══════════════════════════════════
function kpiParis(ts){ return new Date(ts).toLocaleDateString('en-CA',{timeZone:'Europe/Paris'}); }
function kpiAdd(ymd,n){ const [y,m,d]=ymd.split('-').map(Number); const dt=new Date(Date.UTC(y,m-1,d+n)); return dt.toISOString().slice(0,10); }
function kpiMonday(ymd){ const [y,m,d]=ymd.split('-').map(Number); const wd=(new Date(Date.UTC(y,m-1,d)).getUTCDay()+6)%7; return kpiAdd(ymd,-wd); }
function kpiIsoWeek(ymd){ const [y,m,d]=ymd.split('-').map(Number); const dt=new Date(Date.UTC(y,m-1,d)); const dn=(dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-dn+3); const fy=new Date(Date.UTC(dt.getUTCFullYear(),0,4)); return 1+Math.round(((dt-fy)/86400000-3+((fy.getUTCDay()+6)%7))/7); }
const KPI_MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function kpiDm(ymd){ const [y,m,d]=ymd.split('-').map(Number); return d+' '+KPI_MOIS[m-1]; }
function kpiWeekLabel(mon){ return `S${kpiIsoWeek(mon)} · ${kpiDm(mon)} – ${kpiDm(kpiAdd(mon,6))}`; }
const kpiEur=n=>f2(n).replace('.',',')+' €';

function kpiCompute(){
  const byId={}; (D.clients||[]).forEach(c=>{ byId[String(c.id)]=c; });
  const ev=(D.leadEvents||[]).map(e=>({e,c:byId[String(e.client_id)],wk:kpiMonday(kpiParis(e.at))})).filter(x=>x.c);
  const curMon=kpiMonday(kpiParis(Date.now()));
  const spend=D.kpiSpend||{};
  const first=ev.length?ev.reduce((m,x)=>x.wk<m?x.wk:m,curMon):curMon;
  const weeks=[]; for(let w=first;w<=curMon;w=kpiAdd(w,7)) weeks.push(w);
  Object.keys(spend).forEach(w=>{ const m=kpiMonday(w); if(!weeks.includes(m)&&m<=curMon) weeks.push(m); });
  weeks.sort();
  // à défaut de prestation enregistrée : panier saisi, sinon la prestation la plus chère du profil de l'élève
  const SEED=[['Protection céramique',250],['Polish / Correction',180]]; // prestations créées d'office pour tout nouvel élève, tant qu'il ne les a pas modifiées
  const catMax=Math.max(0,...(D.prestations||[]).filter(p=>!SEED.some(x=>x[0]===p.nom&&Number(p.prix)===x[1])).map(p=>Number(p.prix)||0));
  const personalised=catalogPersonalised();
  const panier=personalised?0:((Number(D.kpiPanier)||0)||catMax); // profil rempli => plus d'estimation : le CA vient uniquement des prestations enregistrées
  // CA d'un prospect devenu client = ses rendez-vous (réalisés OU déjà planifiés) à partir du jour où il est arrivé, même si la prestation a lieu des semaines plus tard
  const itv=(c,from)=>(D.interventions||[]).filter(i=>String(i.client_id)===String(c.id)&&(i.statut||'realise')!=='annule'&&String(i.date||'').slice(0,10)>=from);
  const realCa=(c,from)=>itv(c,from).reduce((s,i)=>s+(Number(i.montant)||0),0);
  const cashOf=(c,from)=>itv(c,from).filter(i=>i.statut_paiement==='paye').reduce((s,i)=>s+(Number(i.montant)||0),0);
  const rows=weeks.map(w=>{
    const set=new Map(), since={}; ev.filter(x=>x.wk===w).forEach(x=>{ const k=String(x.c.id); set.set(k,x.c); const d=kpiParis(x.e.at); if(!since[k]||d<since[k]) since[k]=d; });
    const cl=[...set.values()], conv=cl.filter(c=>c.status==='client');
    const sp=spend[w]; const P=cl.length, C=conv.length; let est=false; const cash=conv.reduce((a,c)=>a+cashOf(c,since[String(c.id)]||w),0); const ca=conv.reduce((a,c)=>{ const r=realCa(c,since[String(c.id)]||w)+clientLegacyCa(c); if(r>0) return a+r; if(panier>0){ est=true; return a+panier; } return a; },0);
    return {w,P,C,ca,cash,est,sp,rate:P?C/P*100:0,cpl:(sp>0&&P)?sp/P:null,cac:(sp>0&&C)?sp/C:null,roas:(sp>0&&ca>0)?ca/sp:null,roasCash:(sp>0&&cash>0)?cash/sp:null,cur:w===curMon};
  });
  return {ev,rows,curMon,catMax,estimating:!personalised};
}
async function kpiSavePanier(val){
  const v=String(val).replace(',','.').trim(); const n=v===''?0:Math.max(0,Math.round(parseFloat(v)*100)/100);
  if(isNaN(n)){ alert('Saisis un montant en euros.'); return; }
  const{error}=await sb.from('kpi_settings').upsert({user_id:currentUser.id,panier_moyen:n||null,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(error){ alert('Erreur : '+error.message); return; }
  D.kpiPanier=n; renderPage();
}
function kpiSetRange(v){ S.kpiRange=v; renderPage(); }
function kpiSetGroup(v){ S.kpiGroup=v; renderPage(); }
async function kpiSaveSpend(week,val){
  const v=String(val).replace(',','.').trim(); D.kpiSpend=D.kpiSpend||{};
  if(v===''||isNaN(parseFloat(v))){ const{error}=await sb.from('kpi_spend').delete().eq('user_id',currentUser.id).eq('week_start',week); if(error){ alert('Erreur : '+error.message); return; } delete D.kpiSpend[week]; }
  else { const amount=Math.max(0,Math.round(parseFloat(v)*100)/100); const{error}=await sb.from('kpi_spend').upsert({user_id:currentUser.id,week_start:week,amount,updated_at:new Date().toISOString()},{onConflict:'user_id,week_start'}); if(error){ alert('Erreur : '+error.message); return; } D.kpiSpend[week]=amount; }
  renderPage();
}
function pageKpiFb(){
  const {ev,rows,curMon,catMax,estimating}=kpiCompute();
  const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const top=`<div class="topbar"><div class="page-title">KPI Facebook Ads</div></div>`;
  if(!ev.length&&!rows.some(r=>r.sp)){
    return top+`<div class="card" style="padding:1.5rem"><div style="font-size:15px;font-weight:600;margin-bottom:6px">Tes KPI se remplissent tout seuls</div><div style="font-size:13.5px;color:var(--text-secondary);line-height:1.6">Dès que tes prospects Facebook arrivent dans le CRM, ils apparaissent ici : combien de prospects par semaine, combien sont devenus clients (rendez-vous pris) et quelle publicité les a amenés. Il te suffira de saisir chaque semaine <strong>l'argent dépensé en publicité</strong>.</div></div>`+kpiLegacyDetails();
  }
  const last4=rows.slice(-4);
  const sum=(a,f)=>a.reduce((t,r)=>t+(f(r)||0),0);
  const P4=sum(last4,r=>r.P), C4=sum(last4,r=>r.C), S4=sum(last4,r=>r.sp);
  // les coûts ne se calculent que sur les semaines où la dépense a été saisie
  const lw=last4.filter(r=>r.sp>0), Pw=sum(lw,r=>r.P), Cw=sum(lw,r=>r.C), CAw=sum(lw,r=>r.ca);
  const CA4=sum(last4,r=>r.ca), CAtot=sum(rows,r=>r.ca), est4=last4.some(r=>r.est);
  const nq=new Set(); ev.filter(x=>last4.some(r=>r.w===x.wk)&&x.c.status==='non_qualifie').forEach(x=>nq.add(String(x.c.id)));
  const need='<span style="color:var(--amber-dark)">Saisis tes dépenses ↓</span>';
  const card=(label,val,sub,tip,color)=>`<div class="stat-card" title="${tip}"><div class="stat-label">${label}</div><div class="stat-value"${color?` style="color:${color}"`:''}>${val}</div><div class="stat-sub">${sub||'&nbsp;'}</div></div>`;
  const cards=`<div class="stats-grid cols4" style="margin-bottom:.75rem">
    ${card('Prospects',P4,'4 dernières semaines','Personnes arrivées par ton formulaire Facebook')}
    ${card('Clients',C4,'ont pris rendez-vous','Prospects de ces semaines qui ont pris rendez-vous','var(--green-dark)')}
    ${card('Taux de conversion',P4?f1(C4/P4*100).replace('.',',')+' %':'—','prospect → client','Clients ÷ prospects')}
    ${card('Dépensé',S4?kpiEur(S4):'—',S4?'':need,'Somme des dépenses saisies','var(--red-mid)')}
  </div>
  <div class="stats-grid cols4" style="margin-bottom:1rem">
    ${card('CPL · coût par prospect',(S4>0&&Pw)?kpiEur(S4/Pw):'—',(S4>0&&Pw)?'':need,'Dépenses ÷ prospects (sur les semaines où tu as saisi tes dépenses)')}
    ${card('CAC · coût d\'acquisition client',(S4>0&&Cw)?kpiEur(S4/Cw):'—',(S4>0&&Cw)?'':need,'Dépenses ÷ clients obtenus : ce que te coûte un client en publicité')}
    ${card('ROAS · retour sur dépenses',(S4>0&&CAw>0)?(est4?'≈ ':'')+f2(CAw/S4).replace('.',',')+'x':'—',(S4>0&&CAw>0)?'1 € de pub = '+f2(CAw/S4).replace('.',',')+' € de CA':(S4>0?'<span style="color:var(--amber-dark)">Il manque le CA de tes clients ↑</span>':need),'Chiffre d\'affaires des clients ÷ dépenses. Au-dessus de 1x, la pub rapporte plus qu\'elle ne coûte.')}
    ${card('CA contracté',CA4?(est4?'≈ ':'')+kpiEur(CA4):'—',CA4?'Total depuis le début : '+(est4?'≈ ':'')+kpiEur(CAtot):(C4?(estimating?'<span style="color:var(--amber-dark)">Renseigne ton panier moyen ↓</span>':'<span style="color:var(--amber-dark)">Aucune prestation enregistrée : ajoute tes rendez-vous dans l\'agenda</span>'):''),'Montant des rendez-vous (réalisés ou planifiés) des clients venus de tes prospects')}
  </div>
  ${estimating?`<div class="card" style="margin-bottom:1rem;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="font-size:13px;flex:1;min-width:240px"><strong>Panier moyen estimé</strong> <span style="color:var(--text-secondary)">— utilisé pour le CA et le ROAS quand tu n'as pas enregistré la prestation d'un client (« Mes rendez-vous »). ${catMax>0?`Si tu laisses vide, le CRM prend ta prestation la plus chère : <strong>${kpiEur(catMax).replace(',00','')}</strong>. <em>Cette estimation s'arrête dès que tu as mis tes propres prestations dans « Mon profil ».</em>`:'Ajoute tes prestations dans « Mon profil », ou saisis un montant (l\'estimation s\'arrête dès que ton profil est rempli).'}</span></span>
    <span><input type="number" step="1" min="0" value="${D.kpiPanier||''}" placeholder="${catMax>0?catMax:'ex : 90'}" onchange="kpiSavePanier(this.value)" style="width:90px;padding:6px 8px;border:0.5px solid var(--gray-border-mid);border-radius:6px;font-size:13px;text-align:right"> <span style="font-size:13px">€</span></span></div>`:''}
  <div style="font-size:11.5px;color:var(--text-secondary);margin:-6px 2px 1rem">${nq.size?`${nq.size} prospect(s) non qualifié(s) sur la période · `:''}Les coûts ne se calculent que sur les semaines où tu as saisi « Dépensé ».</div>`;
  // graphique : 8 dernières semaines
  const g=rows.slice(-8), mx=Math.max(1,...g.map(r=>r.P));
  const chart=`<div class="card" style="margin-bottom:1rem"><div class="card-head"><span class="card-title">Prospects et clients par semaine</span><span style="font-size:11.5px;color:var(--text-secondary)"><span style="display:inline-block;width:10px;height:10px;background:#9DB8E8;border-radius:2px;margin-right:4px"></span>Prospects <span style="display:inline-block;width:10px;height:10px;background:var(--green-mid,#2d7a2d);border-radius:2px;margin:0 4px 0 10px"></span>Clients</span></div>
    <div style="display:flex;align-items:flex-end;gap:10px;height:150px;padding:14px 18px 6px;overflow-x:auto">${g.map(r=>`<div style="flex:1;min-width:46px;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="display:flex;align-items:flex-end;gap:3px;height:112px"><div title="${r.P} prospects" style="width:16px;height:${Math.max(2,r.P/mx*112)}px;background:#9DB8E8;border-radius:3px 3px 0 0"></div><div title="${r.C} clients" style="width:16px;height:${Math.max(r.C?2:0,r.C/mx*112)}px;background:var(--green-mid,#2d7a2d);border-radius:3px 3px 0 0"></div></div><div style="font-size:10.5px;color:var(--text-secondary);white-space:nowrap">S${kpiIsoWeek(r.w)}</div><div style="font-size:10.5px;font-weight:600">${r.P} · ${r.C}</div></div>`).join('')}</div></div>`;
  // tableau hebdo
  const tbody=rows.slice().reverse().map(r=>`<tr${r.cur?' style="background:var(--bg-secondary)"':''}>
    <td><strong>${kpiWeekLabel(r.w)}</strong>${r.cur?' <span class="pill pill-blue" style="font-size:10px">en cours</span>':''}</td>
    <td class="td-num">${r.P}</td><td class="td-num"><strong style="color:var(--green-dark)">${r.C}</strong></td><td class="td-num">${r.P?f1(r.rate).replace('.',',')+'%':'—'}</td>
    <td class="td-num"><input type="number" step="0.01" min="0" value="${r.sp!=null?r.sp:''}" placeholder="€" onchange="kpiSaveSpend('${r.w}',this.value)" style="width:88px;padding:5px 7px;border:0.5px solid var(--gray-border-mid);border-radius:6px;font-size:13px;text-align:right"></td>
    <td class="td-num">${r.cpl!=null?kpiEur(r.cpl):'—'}</td><td class="td-num">${r.cac!=null?kpiEur(r.cac):'—'}</td><td class="td-num">${r.ca?(r.est?'≈ ':'')+kpiEur(r.ca):'—'}</td><td class="td-num">${r.roas!=null?(r.est?'≈ ':'')+f2(r.roas).replace('.',',')+'x':'—'}</td></tr>`).join('');
  const table=`<div class="card" style="margin-bottom:1rem"><div class="card-head" style="flex-wrap:wrap;gap:6px"><span class="card-title">Suivi hebdomadaire (automatique)</span><span style="font-size:11.5px;color:var(--text-secondary)">Seule case à remplir : « Dépensé »</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Semaine</th><th class="td-num">Prospects</th><th class="td-num">Clients</th><th class="td-num" title="Clients ÷ prospects">Taux de conv.</th><th class="td-num">Dépensé</th><th class="td-num" title="Coût par prospect">CPL</th><th class="td-num" title="Coût d'acquisition client : dépenses ÷ clients">CAC</th><th class="td-num" title="Rendez-vous réalisés ou planifiés">CA contracté</th><th class="td-num" title="CA contracté des clients de la semaine ÷ dépenses de la semaine">ROAS</th></tr></thead><tbody>${tbody}</tbody></table></div>
    <div style="padding:10px 16px 14px;font-size:12px;color:var(--text-secondary);line-height:1.5">Chaque semaine va du lundi au dimanche. <strong>Clients</strong> = prospects arrivés cette semaine-là qui ont pris rendez-vous (ce nombre peut encore augmenter après la semaine). <strong>CA contracté</strong> = montant des rendez-vous (réalisés ou déjà planifiés) de ces clients ; le <strong>ROAS</strong> de la semaine = ce CA ÷ l'argent dépensé cette semaine-là, <u>même si la prestation a lieu des semaines plus tard</u> : il est toujours rattaché à la semaine où le prospect est arrivé, donc aux dépenses de cette semaine-là. <strong>Dépensé</strong> = le montant de ta pub de la semaine, lu dans ton Gestionnaire de publicités.</div></div>`;
  // récap par publicité
  const range=S.kpiRange||'4w', grp=S.kpiGroup||'creation';
  const prevMon=kpiAdd(curMon,-7), from4=kpiAdd(curMon,-21);
  const inR=wk=>range==='cur'?wk===curMon:range==='prev'?wk===prevMon:range==='4w'?wk>=from4:true;
  const groups=new Map();
  ev.filter(x=>inR(x.wk)).forEach(x=>{ const k=String((['prestation','ville'].includes(grp)?x.c[grp]:x.e[grp])||'').trim()||'Non renseigné'; if(!groups.has(k)) groups.set(k,new Map()); groups.get(k).set(String(x.c.id),x.c); });
  const adRows=[...groups.entries()].map(([k,m])=>{ const cl=[...m.values()]; const C=cl.filter(c=>c.status==='client').length; return {k,P:cl.length,C,rate:cl.length?C/cl.length*100:0}; }).sort((a,b)=>b.C-a.C||b.P-a.P);
  const mxA=Math.max(1,...adRows.map(r=>r.P));
  const chip=(cur,set,v,l)=>`<span onclick="${set}('${v}')" style="cursor:pointer;padding:4px 11px;border-radius:100px;font-size:12px;font-weight:500;border:0.5px solid var(--gray-border-mid);background:${cur===v?'var(--blue)':'var(--bg-primary)'};color:${cur===v?'#fff':'var(--text-secondary)'}">${l}</span>`;
  const best=adRows.length&&adRows[0].C>0?adRows[0].k:null;
  const recap=`<div class="card" style="margin-bottom:1rem"><div class="card-head" style="flex-wrap:wrap;gap:8px"><span class="card-title">Qu'est-ce qui amène des clients ?</span></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;padding:0 1rem 6px">${chip(range,'kpiSetRange','cur','Cette semaine')}${chip(range,'kpiSetRange','prev','Semaine dernière')}${chip(range,'kpiSetRange','4w','4 dernières semaines')}${chip(range,'kpiSetRange','all','Tout')}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;padding:0 1rem 10px"><span style="font-size:12px;color:var(--text-secondary);align-self:center">Regrouper par :</span>${chip(grp,'kpiSetGroup','creation','Publicité')}${chip(grp,'kpiSetGroup','ensemble','Ensemble')}${chip(grp,'kpiSetGroup','campagne','Campagne')}${chip(grp,'kpiSetGroup','prestation','Service demandé')}${chip(grp,'kpiSetGroup','ville','Ville')}</div>
    <div class="tbl-wrap"><table><thead><tr><th>${({creation:'Publicité',ensemble:'Ensemble de publicités',campagne:'Campagne',prestation:'Service demandé',ville:'Ville'})[grp]||'Publicité'}</th><th class="td-num">Prospects</th><th class="td-num">Clients</th><th class="td-num">Conv.</th><th style="min-width:140px"></th></tr></thead>
    <tbody>${adRows.length===0?'<tr><td colspan="5" class="empty">Aucun prospect sur cette période</td></tr>':adRows.map(r=>`<tr><td style="max-width:320px"><strong>${esc(r.k)}</strong>${r.k===best?' <span title="La plus de clients sur la période" style="font-size:11px">🏆</span>':''}</td><td class="td-num">${r.P}</td><td class="td-num"><strong style="color:var(--green-dark)">${r.C}</strong></td><td class="td-num">${f1(r.rate).replace('.',',')}%</td>
      <td><div style="height:10px;background:#E7EEF9;border-radius:5px;position:relative;width:100%"><div style="position:absolute;left:0;top:0;height:10px;width:${r.P/mxA*100}%;background:#9DB8E8;border-radius:5px"></div><div style="position:absolute;left:0;top:0;height:10px;width:${r.C/mxA*100}%;background:var(--green-mid,#2d7a2d);border-radius:5px"></div></div></td></tr>`).join('')}</tbody></table></div>
    <div style="padding:10px 16px 14px;font-size:12px;color:var(--text-secondary);line-height:1.5">Compte les prospects arrivés pendant la période, et ceux qui ont pris rendez-vous depuis. Une publicité avec peu de prospects ne permet pas encore de conclure.</div></div>`;
  const hintKpi=(est4&&estimating)?`<div style="background:#FFF4E5;color:#8A4B00;border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.5;margin-bottom:1rem">⚠️ <strong>Une partie de ton CA est estimée</strong> (signalée par « ≈ »), parce que certains clients n'ont pas de prestation enregistrée. Pour un chiffre exact : ajoute chaque rendez-vous dans l'<strong>agenda</strong> avec son prix.</div>`:'';
  return top+cards+hintKpi+chart+table+recap+kpiLegacyDetails();
}

function exportToGoogleCalendar(interv){
  const pad = n => String(n).padStart(2,'0');
  const dateCompact = (interv.date||'').replace(/-/g,'');
  const [h,m] = (interv.heure||'09:00').split(':');
  const start = `${dateCompact}T${pad(h)}${pad(m)}00`;
  const finHeure = addMinutes(interv.heure||'09:00', interv.duree||60).replace(':','');
  const end = `${dateCompact}T${finHeure}00`;
  const title = encodeURIComponent(`${interv.client_name} — ${interv.prestation||'Prestation'}`);
  const details = encodeURIComponent(buildGoogleDescription(interv));
  const location = encodeURIComponent(interv.adresse||'');
  const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${details}&location=${location}`;
  window.open(url, '_blank');
}

function prefillFactureClient(clientId){
  if(!clientId||clientId==='nouveau') return;
  const c = D.clients.find(x=>x.id==clientId||x.id===clientId);
  if(!c) return;
  S.formDoc.client = c.name;
  S.formDoc.clientTel = c.phone||'';
  S.formDoc.clientAdresse = c.adresse_postale||'';
  S.formDoc.clientEmail = c.email||'';
  renderPage();
}

function selectFacturePrestation(idx, prestId){
  if(!prestId||prestId==='libre') return;
  const p = D.prestations.find(p=>p.id==prestId);
  if(!p) return;
  S.formDoc.lignes[idx].nom = p.nom;
  S.formDoc.lignes[idx].description = p.description||'';
  S.formDoc.lignes[idx].prix = p.prix;
  renderPage();
}

function addFactureLigne(){
  if(!S.formDoc) return;
  S.formDoc.lignes.push({id:Date.now(), nom:'', description:'', quantite:1, prix:0});
  renderPage();
}

function removeFactureLigne(idx){
  if(!S.formDoc) return;
  S.formDoc.lignes.splice(idx,1);
  if(S.formDoc.lignes.length===0) S.formDoc.lignes=[{id:Date.now(),nom:'',description:'',quantite:1,prix:0}];
  renderPage();
}

function updateFactureTotal(){
  if(!S.formDoc) return;
  const totalHT = S.formDoc.lignes.reduce((s,l)=>s+(parseFloat(l.quantite||1)*parseFloat(l.prix||0)),0);
  const tva = parseFloat(S.formDoc.tva||0);
  const totalTTC = totalHT*(1+tva/100);
  const elHT = document.getElementById('fact-ht');
  const elTTC = document.getElementById('fact-ttc');
  if(elHT) elHT.textContent = totalHT.toFixed(2)+'€';
  if(elTTC) elTTC.textContent = totalTTC.toFixed(2)+'€';
}

function saveFactureDoc(){
  const fd = S.formDoc;
  if(!fd) return;
  const clientName = fd.client||(document.getElementById('fc-client')?.value||'');
  if(!clientName.trim()){ alert('Nom du client requis.'); return; }
  const lignes = fd.lignes.filter(l=>l.nom||l.prix>0);
  if(lignes.length===0){ alert('Ajoute au moins une prestation.'); return; }

  const totalHT = lignes.reduce((s,l)=>s+Math.round(parseFloat(l.quantite||1)*parseFloat(l.prix||0)*100)/100,0);
  const tva = parseFloat(fd.tva||0);
  const totalTTC = Math.round(totalHT*(1+tva/100)*100)/100;

  if(fd._docId !== 'new'){
    // Edit existing
    const idx = D.factures.findIndex(f=>f.id===fd._docId);
    if(idx>=0){
      D.factures[idx]={...D.factures[idx],
        type:fd.type,date:fd.date,
        client:clientName.trim(),clientAdresse:fd.clientAdresse||'',
        clientTel:fd.clientTel||'',clientEmail:fd.clientEmail||'',
        lignes:lignes.map(l=>({...l,quantite:parseFloat(l.quantite)||1,prix:parseFloat(l.prix)||0})),
        tva,totalHT,totalTTC,notes:fd.notes||''
      };
    }
    try{localStorage.setItem('ecolia_factures_'+currentUser.id,JSON.stringify(D.factures));}catch(e){}
    S.editDocId=null; S.formDoc=null;
    S.previewDocId = fd._docId;
    render(); return;
  }

  // New doc
  const prefix = fd.type==='devis'?'DE':'FA';
  const numero = fd.numero?.trim() || (prefix+'-'+new Date().getFullYear()+'-'+String(D.nextFactureNum++).padStart(3,'0'));
  const newDoc = {
    id: Date.now(),
    type:fd.type, numero,
    client:clientName.trim(),
    clientAdresse:fd.clientAdresse||'',
    clientTel:fd.clientTel||'',
    clientEmail:fd.clientEmail||'',
    date:fd.date||new Date().toISOString().slice(0,10),
    lignes:lignes.map(l=>({...l,quantite:parseFloat(l.quantite)||1,prix:parseFloat(l.prix)||0})),
    tva,totalHT,totalTTC,
    statut:fd.type==='devis'?'devis':'attente',
    notes:fd.notes||''
  };
  D.factures.push(newDoc);
  try{localStorage.setItem('ecolia_factures_'+currentUser.id,JSON.stringify(D.factures));
      localStorage.setItem('ecolia_facturenum_'+currentUser.id,String(D.nextFactureNum));}catch(e){}
  S.newDoc=null; S.formDoc=null;
  S.previewDocId = newDoc.id;
  render();
}
